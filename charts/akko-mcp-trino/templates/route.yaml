{{- if .Values.route.enabled }}
{{- $tls := .Values.route.tls }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "mcp-trino.fullname" . }}
  labels:
    {{- include "mcp-trino.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  {{- with .Values.route.path }}
  path: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "mcp-trino.fullname" . }}
    weight: 100
  port:
    targetPort: {{ .Values.route.targetPort | default "mcp" }}
  tls:
    termination: {{ $tls.termination }}
    insecureEdgeTerminationPolicy: {{ $tls.insecureEdgeTerminationPolicy }}
    {{- with $tls.externalCertificate }}
    externalCertificate:
      name: {{ . | quote }}
    {{- end }}
    {{- if eq $tls.termination "reencrypt" }}
    {{- with $tls.destinationCACertificate }}
    destinationCACertificate: |
      {{- . | nindent 6 }}
    {{- end }}
    {{- end }}
{{- with $tls.externalCertificate }}
---
# The router reads the certificate's Secret only with this permission, as OpenShift
# documents for spec.tls.externalCertificate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp-trino.fullname" $ }}-route-certificate
  labels:
    {{- include "mcp-trino.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp-trino.fullname" $ }}-route-certificate
  labels:
    {{- include "mcp-trino.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp-trino.fullname" $ }}-route-certificate
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
{{- end }}
{{- end }}
