{{- if .Values.tests.enabled }}
{{- $url := printf "http://%s:%v" (include "mcp-trino.healthName" .) .Values.ports.health }}
{{- $fullName := include "mcp-trino.fullname" . }}
{{- $notReady := printf "no pod is ready behind the Service %s: its /ready probe fails. The cause is in the events of the pod (kubectl -n %s describe pod -l app.kubernetes.io/instance=%s,app.kubernetes.io/component=server) and in /ready (kubectl -n %s port-forward deployment/%s %v:%v, then curl -s localhost:%v/ready)" (include "mcp-trino.healthName" .) .Release.Namespace .Release.Name .Release.Namespace $fullName .Values.ports.health .Values.ports.health .Values.ports.health }}
# helm test: the server answers /health (and /ready) through its Service, and
# `akko-mcp-trino --check` accepts the release's configuration (exit 0), with the same
# settings, secrets and mounts as the server.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "mcp-trino.fullname" . }}-test
  labels:
    {{- include "mcp-trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "mcp-trino.serviceAccountName" . }}
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- include "mcp-trino.podSecurityContext" . | nindent 4 }}
  containers:
    - name: check
      image: {{ include "mcp-trino.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - sh
        - -ec
        - |
          # A NetworkPolicy may take a few seconds to admit a new pod: retry for 60 s.
          # -I: neither the working directory nor PYTHON* variables shape what Python imports.
          python -I - "{{ $url }}" {{ $notReady | squote }} /health{{ if .Values.tests.ready }} /ready{{ end }} <<'EOF'
          import sys, time, urllib.error, urllib.request
          base, not_ready, paths = sys.argv[1], sys.argv[2], sys.argv[3:]
          for path in paths:
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(base + path, timeout=10) as response:
                          print(base + path, response.status, response.read().decode())
                          break
                  except OSError as exc:
                      if attempt == 29:
                          # Refused or unreachable, not an HTTP answer: no pod behind the Service.
                          hint = "" if isinstance(exc, urllib.error.HTTPError) else f"; {not_ready}"
                          sys.exit(f"{base + path}: {exc}{hint}")
                      time.sleep(2)
          EOF
          akko-mcp-trino --check
      envFrom:
        {{- include "mcp-trino.envFrom" . | nindent 8 }}
      {{- with (include "mcp-trino.env" . | trim) }}
      env:
        {{- . | nindent 8 }}
      {{- end }}
      volumeMounts:
        {{- include "mcp-trino.volumeMounts" . | nindent 8 }}
      {{- with .Values.tests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumes:
    {{- include "mcp-trino.volumes" . | nindent 4 }}
{{- end }}
