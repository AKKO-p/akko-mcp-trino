{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mcp-trino.fullname" . }}
  labels:
    {{- include "mcp-trino.labels" . | nindent 4 }}
spec:
  {{- if not (kindIs "invalid" .Values.podDisruptionBudget.maxUnavailable) }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  {{- /* An explicit 0 stays 0; only an unset value becomes 1. */}}
  minAvailable: {{ ternary 1 .Values.podDisruptionBudget.minAvailable (kindIs "invalid" .Values.podDisruptionBudget.minAvailable) }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-trino.serverSelectorLabels" . | nindent 6 }}
{{- end }}
