<text x="440.0" y="484" font-size="13.5" text-anchor="middle" class="mu" xml:space="preserve">Mistral varies more from one run to the next than the gap between the versions.</text>
<text x="440.0" y="506" font-size="13.5" text-anchor="middle" class="mu" xml:space="preserve">Fewer tool calls, but about 41% more input tokens per question, from longer tool descriptions.</text>
<text x="440.0" y="536" font-size="12.5" text-anchor="middle" class="fa" xml:space="preserve">Mistral Codestral answered 40 times per version, and Claude Sonnet 5.5 answered 15 times. Mistral's tool calls come from the five-trial run.</text>
