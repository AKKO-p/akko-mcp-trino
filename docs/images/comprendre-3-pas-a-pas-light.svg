<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1151" viewBox="0 0 880 1151" role="img" aria-labelledby="t d">
<title id="t">L’agent pas à pas</title>
<desc id="d">Six étapes : la question, search_columns avec revenue customer, aucune colonne avec les deux mots, les correspondances mot par mot avec leurs words, describe_schema, puis execute_query.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'DejaVu Sans', sans-serif;fill:#0f1b2d}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.mu{fill:#4d5a70} .fa{fill:#7d8798} .ac{fill:#4a42d4} .am{fill:#a16207}
.ok{fill:#15803d} .no{fill:#b42318} .b{font-weight:600} .bb{font-weight:700}
.ln{fill:none;stroke:#4d5a70;stroke-width:1.5} .dash{stroke-dasharray:4 4}
.grid{stroke:#e3e6ec;stroke-width:1}
</style>
<path d="M28.5 0.5H851.5A28 28 0 0 1 879.5 28.5V1136.5A14 14 0 0 1 865.5 1150.5H14.5A14 14 0 0 1 0.5 1136.5V28.5A28 28 0 0 1 28.5 0.5Z" fill="#f6f7f9" stroke="#e3e6ec"/>
<rect x="260" y="-20" width="360" height="38" rx="19" fill="#ffffff" stroke="#e3e6ec"/>
<path d="M62 131V960" stroke="#e3e6ec" stroke-width="2"/>
<circle cx="62" cy="131" r="17" fill="#4a42d4"/>
<text x="62" y="136.5" font-size="15" text-anchor="middle" class="bb" fill="#ffffff" style="fill:#ffffff" xml:space="preserve">1</text>
<circle cx="62" cy="254" r="17" fill="#4a42d4"/>
<text x="62" y="259.5" font-size="15" text-anchor="middle" class="bb" fill="#ffffff" style="fill:#ffffff" xml:space="preserve">2</text>
<circle cx="62" cy="438" r="17" fill="#4a42d4"/>
<text x="62" y="443.5" font-size="15" text-anchor="middle" class="bb" fill="#ffffff" style="fill:#ffffff" xml:space="preserve">3</text>
<circle cx="62" cy="582" r="17" fill="#4a42d4"/>
<text x="62" y="587.5" font-size="15" text-anchor="middle" class="bb" fill="#ffffff" style="fill:#ffffff" xml:space="preserve">4</text>
<circle cx="62" cy="837" r="17" fill="#4a42d4"/>
<text x="62" y="842.5" font-size="15" text-anchor="middle" class="bb" fill="#ffffff" style="fill:#ffffff" xml:space="preserve">5</text>
<circle cx="62" cy="960" r="17" fill="#4a42d4"/>
<text x="62" y="965.5" font-size="15" text-anchor="middle" class="bb" fill="#ffffff" style="fill:#ffffff" xml:space="preserve">6</text>
<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">Comment l’agent trouve la bonne colonne</text>
<text x="440.0" y="90" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">Une vraie question, tool call par tool call. La réponse de la recherche est celle du serveur, mot pour mot.</text>
<rect x="104" y="120" width="101.4" height="24" rx="8" fill="#ecebfb"/>
<text x="114" y="137" font-size="13" class="ac b" xml:space="preserve">la personne</text>
<text x="104" y="168" font-size="18" class="bb" xml:space="preserve">« Quel est le chiffre d’affaires par client ? »</text>
<text x="104" y="192" font-size="14.5" class="mu" xml:space="preserve">L’agent ne connaît pas les tables, et il ne doit surtout pas deviner les noms de colonnes.</text>
<rect x="104" y="243" width="130.60000000000002" height="24" rx="8" fill="#ecebfb"/>
<text x="114" y="260" font-size="13" class="m ac b" xml:space="preserve">search_columns</text>
<text x="244.60000000000002" y="260" font-size="13" class="fa" xml:space="preserve">cherche dans tous les catalogs que la personne voit</text>
<text x="104" y="291" font-size="18" class="bb" xml:space="preserve">Il cherche avec deux mots : revenue customer</text>
<text x="104" y="315" font-size="14.5" class="mu" xml:space="preserve">Un seul tool call sur tous les catalogs qu’il a le droit de voir, au lieu de les parcourir un par</text>
<text x="104" y="336" font-size="14.5" class="mu" xml:space="preserve">un.</text>
<rect x="104" y="357" width="300" height="34" rx="10" fill="#f2f3f7"/>
<text x="118" y="379" font-size="13" class="m" xml:space="preserve"><tspan class="ac">"text"</tspan><tspan class="mu">: </tspan><tspan class="ok">"revenue customer"</tspan></text>
<rect x="104" y="427" width="94.0" height="24" rx="8" fill="#ecebfb"/>
<text x="114" y="444" font-size="13" class="ac b" xml:space="preserve">le serveur</text>
<text x="104" y="475" font-size="18" class="bb" xml:space="preserve">Aucune colonne ne porte les deux mots ensemble</text>
<text x="104" y="499" font-size="14.5" class="mu" xml:space="preserve">Avant la 0.7.0, l’agent recevait « rien trouvé » et Mistral s’arrêtait là. Maintenant, le serveur</text>
<text x="104" y="520" font-size="14.5" class="mu" xml:space="preserve">cherche chaque mot séparément.</text>
<rect x="104" y="571" width="145.8" height="24" rx="8" fill="#ecebfb"/>
<text x="114" y="588" font-size="13" class="ac b" xml:space="preserve">le serveur répond</text>
<text x="104" y="619" font-size="18" class="bb" xml:space="preserve">Chaque résultat dit quel mot il a trouvé</text>
<text x="104" y="643" font-size="14.5" class="mu" xml:space="preserve">Le serveur ajoute "partial": true pour que l’agent sache que ce sont des correspondances partielles.</text>
<rect x="104" y="666" width="232" height="58" rx="10" fill="#f6f7f9" stroke="#15803d" stroke-width="1.6"/>
<text x="116" y="689" font-size="13" class="m" xml:space="preserve">crm.transactions.amount</text>
<rect x="116" y="698" width="67.80000000000001" height="18" rx="9" fill="#fbf3e3"/>
<text x="149.9" y="711" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">revenue</text>
<rect x="348" y="666" width="232" height="58" rx="10" fill="#f6f7f9" stroke="#15803d" stroke-width="1.6"/>
<text x="360" y="689" font-size="13" class="m" xml:space="preserve">crm.accounts.customer_id</text>
<rect x="360" y="698" width="75.2" height="18" rx="9" fill="#fbf3e3"/>
<text x="397.6" y="711" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">customer</text>
<rect x="592" y="666" width="232" height="58" rx="10" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="604" y="689" font-size="13" class="m" xml:space="preserve">crm.customers.segment</text>
<rect x="604" y="698" width="75.2" height="18" rx="9" fill="#fbf3e3"/>
<text x="641.6" y="711" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">customer</text>
<rect x="104" y="736" width="744" height="54" rx="10" fill="#f2f3f7"/>
<text x="118" y="757" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"comment"</tspan><tspan class="mu">: </tspan><tspan class="ok">"Booked amount in the account currency: the revenue of a sale"</tspan><tspan class="mu">,</tspan></text>
<text x="118" y="777" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"words"</tspan><tspan class="mu">: [</tspan><tspan class="ok">"revenue"</tspan><tspan class="mu">]  …  </tspan><tspan class="ac">"partial"</tspan><tspan class="mu">: </tspan><tspan class="ok">true</tspan></text>
<rect x="104" y="826" width="138.5" height="24" rx="8" fill="#ecebfb"/>
<text x="114" y="843" font-size="13" class="m ac b" xml:space="preserve">describe_schema</text>
<text x="252.5" y="843" font-size="13" class="fa" xml:space="preserve">tout un schéma en un appel</text>
<text x="104" y="874" font-size="18" class="bb" xml:space="preserve">Les colonnes de crm, en un seul tool call</text>
<text x="104" y="898" font-size="14.5" class="mu" xml:space="preserve">L’agent voit la jointure : transactions.account_id vers accounts.id, puis accounts.customer_id.</text>
<rect x="104" y="949" width="122.7" height="24" rx="8" fill="#ecebfb"/>
<text x="114" y="966" font-size="13" class="m ac b" xml:space="preserve">execute_query</text>
<text x="236.7" y="966" font-size="13" class="fa" xml:space="preserve">exécute la requête au nom de la personne</text>
<text x="104" y="997" font-size="18" class="bb" xml:space="preserve">SUM(amount) par customer_id</text>
<text x="104" y="1021" font-size="14.5" class="mu" xml:space="preserve">La requête part sous l’identité de la personne. Trino applique ses droits, et l’agent cite les</text>
<text x="104" y="1042" font-size="14.5" class="mu" xml:space="preserve">colonnes utilisées.</text>
<path d="M105.5 1065V1113" stroke="#4a42d4" stroke-width="3"/>
<text x="118" y="1083" font-size="14.5" xml:space="preserve">Le chiffre d’affaires de chaque client, calculé sur transactions.amount, relié par</text>
<text x="118" y="1104" font-size="14.5" xml:space="preserve">accounts.customer_id.</text>
</svg>
