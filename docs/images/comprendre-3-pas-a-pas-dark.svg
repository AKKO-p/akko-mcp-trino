<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1420" viewBox="0 0 880 1420" role="img" aria-labelledby="t d">
<title id="t">L’agent pas à pas</title>
<desc id="d">Un vrai essai en six étapes, Mistral en 0.7.0. Il demande quel segment de clients détient le plus gros solde total, cherche avec quatre mots et reçoit des résultats mot par mot, fait une jointure sur une colonne qui n’existe pas, lit le conseil du serveur, lit les colonnes de customers avec describe_table, corrige la jointure et obtient business, 17620.75.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'DejaVu Sans', sans-serif;fill:#e8ecf4}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.mu{fill:#a6b0c3} .fa{fill:#7a859b} .ac{fill:#8f88ff} .am{fill:#e0a43a}
.ok{fill:#4ade80} .no{fill:#f87171} .b{font-weight:600} .bb{font-weight:700}
.ln{fill:none;stroke:#a6b0c3;stroke-width:1.5} .dash{stroke-dasharray:4 4}
.grid{stroke:#24304a;stroke-width:1}
</style>
<path d="M28.5 0.5H851.5A28 28 0 0 1 879.5 28.5V1405.5A14 14 0 0 1 865.5 1419.5H14.5A14 14 0 0 1 0.5 1405.5V28.5A28 28 0 0 1 28.5 0.5Z" fill="#131b2c" stroke="#24304a"/>
<rect x="260" y="-20" width="360" height="38" rx="19" fill="#0d1117" stroke="#24304a"/>
<path d="M62 131V1100" stroke="#24304a" stroke-width="2"/>
<circle cx="62" cy="131" r="17" fill="#8f88ff"/>
<text x="62" y="136.5" font-size="15" text-anchor="middle" class="bb" style="fill:#0c1220">1</text>
<circle cx="62" cy="249" r="17" fill="#8f88ff"/>
<text x="62" y="254.5" font-size="15" text-anchor="middle" class="bb" style="fill:#0c1220">2</text>
<circle cx="62" cy="390" r="17" fill="#8f88ff"/>
<text x="62" y="395.5" font-size="15" text-anchor="middle" class="bb" style="fill:#0c1220">3</text>
<circle cx="62" cy="672" r="17" fill="#8f88ff"/>
<text x="62" y="677.5" font-size="15" text-anchor="middle" class="bb" style="fill:#0c1220">4</text>
<circle cx="62" cy="918" r="17" fill="#8f88ff"/>
<text x="62" y="923.5" font-size="15" text-anchor="middle" class="bb" style="fill:#0c1220">5</text>
<circle cx="62" cy="1100" r="17" fill="#8f88ff"/>
<text x="62" y="1105.5" font-size="15" text-anchor="middle" class="bb" style="fill:#0c1220">6</text>
<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">Comment l’agent trouve la bonne colonne</text>
<text x="440.0" y="90" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">Un vrai essai, tool call par tool call (Mistral, 0.7.0). Chaque réponse montrée est celle du serveur.</text>
<rect x="104" y="120" width="101.4" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="137" font-size="13" class="ac b" xml:space="preserve">la personne</text>
<text x="104" y="168" font-size="18" class="bb" xml:space="preserve">« Quel segment de clients détient le plus gros solde total ? »</text>
<text x="104" y="192" font-size="14.5" class="mu" xml:space="preserve">L’agent ne connaît pas les tables, alors il cherche avant d’écrire du SQL.</text>
<rect x="104" y="238" width="130.60000000000002" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="255" font-size="13" class="m ac b" xml:space="preserve">search_columns</text>
<text x="244.60000000000002" y="255" font-size="13" class="fa" xml:space="preserve">cherche dans tous les catalogs que la personne voit</text>
<text x="104" y="286" font-size="18" class="bb" xml:space="preserve">Il cherche avec quatre mots</text>
<rect x="104" y="305" width="350.25" height="34" rx="10" fill="#0f1626"/>
<text x="118" y="327" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"text"</tspan><tspan class="mu">: </tspan><tspan class="ok">"customer segment account balance"</tspan></text>
<rect x="104" y="379" width="145.8" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="396" font-size="13" class="ac b" xml:space="preserve">le serveur répond</text>
<text x="104" y="427" font-size="18" class="bb" xml:space="preserve">Aucune colonne ne porte les quatre mots, alors il cherche mot par mot</text>
<text x="104" y="451" font-size="14.5" class="mu" xml:space="preserve">Chaque résultat liste les mots qui l’ont trouvé, dans l’ordre de la réponse du serveur.</text>
<rect x="104" y="467" width="240" height="58" rx="10" fill="#131b2c" stroke="#4ade80" stroke-width="1.6"/>
<text x="116" y="490" font-size="13" class="m" xml:space="preserve">crm.accounts.balance</text>
<text x="334" y="516" font-size="11.5" text-anchor="end" class="ok b" xml:space="preserve">retenue</text>
<rect x="116" y="499" width="67.80000000000001" height="18" rx="9" fill="#2a2112"/>
<text x="149.9" y="512" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">account</text>
<rect x="189.8" y="499" width="67.80000000000001" height="18" rx="9" fill="#2a2112"/>
<text x="223.70000000000002" y="512" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">balance</text>
<rect x="356" y="467" width="240" height="58" rx="10" fill="#131b2c" stroke="#4ade80" stroke-width="1.6"/>
<text x="368" y="490" font-size="13" class="m" xml:space="preserve">crm.customers.segment</text>
<text x="586" y="516" font-size="11.5" text-anchor="end" class="ok b" xml:space="preserve">retenue</text>
<rect x="368" y="499" width="75.2" height="18" rx="9" fill="#2a2112"/>
<text x="405.6" y="512" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">customer</text>
<rect x="449.2" y="499" width="67.80000000000001" height="18" rx="9" fill="#2a2112"/>
<text x="483.1" y="512" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">segment</text>
<rect x="608" y="467" width="240" height="58" rx="10" fill="#131b2c" stroke="#4ade80" stroke-width="1.6"/>
<text x="620" y="490" font-size="13" class="m" xml:space="preserve">crm.accounts.customer_id</text>
<text x="838" y="516" font-size="11.5" text-anchor="end" class="ok b" xml:space="preserve">retenue</text>
<rect x="620" y="499" width="75.2" height="18" rx="9" fill="#2a2112"/>
<text x="657.6" y="512" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">customer</text>
<text x="104" y="551" font-size="13.5" class="mu" xml:space="preserve">et transactions.account_id, transactions.amount, trouvées par « <tspan class="m">account</tspan> »</text>
<rect x="104" y="567" width="693.375" height="54" rx="10" fill="#0f1626"/>
<text x="118" y="589" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"partial"</tspan><tspan class="mu">: </tspan><tspan class="ok">true</tspan><tspan class="mu">,</tspan></text>
<text x="118" y="609" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"hint"</tspan><tspan class="mu">: </tspan><tspan class="ok">"No table or column holds every word together, so these are partial matches, …"</tspan></text>
<rect x="104" y="661" width="122.7" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="678" font-size="13" class="m ac b" xml:space="preserve">execute_query</text>
<text x="236.7" y="678" font-size="13" class="fa" xml:space="preserve">exécute la requête au nom de la personne</text>
<text x="104" y="709" font-size="18" class="bb" xml:space="preserve">Il fait une jointure sur une colonne qui n’existe pas</text>
<text x="104" y="733" font-size="14.5" class="mu" xml:space="preserve">Le serveur répond avec le type d’erreur et la table à lire.</text>
<rect x="104" y="749" width="304.5" height="34" rx="10" fill="#0f1626"/>
<text x="118" y="771" font-size="12.5" class="m" xml:space="preserve"><tspan class="mu">… ON </tspan><tspan class="no b">c.customer_id</tspan><tspan class="mu"> = a.customer_id …</tspan></text>
<rect x="104" y="793" width="586.625" height="74" rx="10" fill="#0f1626"/>
<text x="118" y="815" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"kind"</tspan><tspan class="mu">: </tspan><tspan class="ok">"column"</tspan><tspan class="mu">, </tspan><tspan class="ac">"identifier"</tspan><tspan class="mu">: </tspan><tspan class="ok">"c.customer_id"</tspan><tspan class="mu">,</tspan></text>
<text x="118" y="835" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"hint"</tspan><tspan class="mu">: </tspan><tspan class="ok">"Read the columns of demo.crm.customers with describe_table, then</tspan></text>
<text x="118" y="855" font-size="12.5" class="m" xml:space="preserve"><tspan class="ok">         write the query again with a column it has."</tspan></text>
<rect x="104" y="907" width="130.60000000000002" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="924" font-size="13" class="m ac b" xml:space="preserve">describe_table</text>
<text x="244.60000000000002" y="924" font-size="13" class="fa" xml:space="preserve">les colonnes d’une table</text>
<text x="104" y="955" font-size="18" class="bb" xml:space="preserve">Il lit les colonnes de customers</text>
<text x="104" y="979" font-size="14.5" class="mu" xml:space="preserve">La table a une colonne id, pas customer_id.</text>
<rect x="104" y="995" width="685.75" height="54" rx="10" fill="#0f1626"/>
<text x="118" y="1017" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"rows"</tspan><tspan class="mu">: [[</tspan><tspan class="ok b">"id"</tspan><tspan class="mu">, "integer", "", ""], ["full_name", "varchar", "", ""],</tspan></text>
<text x="118" y="1037" font-size="12.5" class="m" xml:space="preserve"><tspan class="mu">         ["email", "varchar", "", ""], ["country", "char(2)", "", ""], ["segment", …]]</tspan></text>
<rect x="104" y="1089" width="122.7" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="1106" font-size="13" class="m ac b" xml:space="preserve">execute_query</text>
<text x="236.7" y="1106" font-size="13" class="fa" xml:space="preserve">exécute la requête au nom de la personne</text>
<text x="104" y="1137" font-size="18" class="bb" xml:space="preserve">Il corrige la jointure et obtient la réponse</text>
<text x="104" y="1161" font-size="14.5" class="mu" xml:space="preserve">La requête part sous le nom de carol_analyst, donc le row filter de Trino ne garde que ses clients</text>
<text x="104" y="1182" font-size="14.5" class="mu" xml:space="preserve">européens.</text>
<rect x="104" y="1198" width="235.875" height="34" rx="10" fill="#0f1626"/>
<text x="118" y="1220" font-size="12.5" class="m" xml:space="preserve"><tspan class="mu">… ON </tspan><tspan class="ok b">c.id</tspan><tspan class="mu"> = a.customer_id …</tspan></text>
<rect x="104" y="1242" width="411.25" height="34" rx="10" fill="#0f1626"/>
<text x="118" y="1264" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"rows"</tspan><tspan class="mu">: [[</tspan><tspan class="ok">"business"</tspan><tspan class="mu">, </tspan><tspan class="ok">"17620.75"</tspan><tspan class="mu">]], </tspan><tspan class="ac">"row_count"</tspan><tspan class="mu">: 1</tspan></text>
<path d="M105.5 1288V1336" stroke="#8f88ff" stroke-width="3"/>
<text x="118" y="1306" font-size="14.5" xml:space="preserve">The customer segment that holds the largest total account balance is the business segment,</text>
<text x="118" y="1327" font-size="14.5" xml:space="preserve">with a total balance of 17620.75.</text>
<text x="440.0" y="1392" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">En 0.7.0, Mistral a bien répondu à cette question dans 4 essais sur 5, contre 0 sur 5 en 0.6.1.</text>
</svg>
