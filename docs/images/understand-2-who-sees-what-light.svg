<text x="654" y="348" font-size="12.5" class="m am" xml:space="preserve">***@example.org</text>
<text x="780" y="348" font-size="12.5" class="m" xml:space="preserve">NL</text>
<text x="514" y="414" font-size="16" class="m bb" xml:space="preserve">dave_viewer</text>
<rect x="631.8" y="399" width="59.599999999999994" height="21" rx="10.5" fill="#ecebfb"/>
<text x="661.5999999999999" y="414" font-size="12" text-anchor="middle" class="m ac" xml:space="preserve">viewer</text>
<text x="514" y="438" font-size="14" class="mu" xml:space="preserve">The customers table is hidden from him.</text>
<rect x="514" y="454" width="316" height="56" rx="10" fill="#fbeaea"/>
<text x="672.0" y="478" font-size="13" text-anchor="middle" class="m no" xml:space="preserve">Table demo.crm.customers</text>
<text x="672.0" y="497" font-size="13" text-anchor="middle" class="m no" xml:space="preserve">not found or not visible</text>
<text x="440.0" y="560" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">These three answers come from Trino, with the sandbox's OPA policy.</text>
<text x="440.0" y="582" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">The MCP server copies no rule: it only passes on each person's identity.</text>
