<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610" role="img" aria-labelledby="t d">
<title id="t">Who sees what</title>
<desc id="d">The same question by three sandbox users. alice_admin sees the 10 customers in clear. carol_analyst sees the 5 European customers with masked e-mails. For dave_viewer the customers table is not found or not visible.</desc>
<style>
