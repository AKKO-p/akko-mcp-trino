<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">Who sees what?</text>
<text x="440.0" y="90" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">The same question, the list of customers, through the same agent and the same server.</text>
<text x="50" y="146" font-size="16" class="m bb" xml:space="preserve">alice_admin</text>
<rect x="167.8" y="131" width="52.0" height="21" rx="10.5" fill="#ecebfb"/>
<text x="193.8" y="146" font-size="12" text-anchor="middle" class="m ac" xml:space="preserve">admin</text>
<text x="50" y="170" font-size="14" class="mu" xml:space="preserve">Every row, every column in clear.</text>
<text x="50" y="200" font-size="12" class="m fa" xml:space="preserve">id</text>
<text x="80" y="200" font-size="12" class="m fa" xml:space="preserve">full_name</text>
<text x="204" y="200" font-size="12" class="m fa" xml:space="preserve">email</text>
<text x="420" y="200" font-size="12" class="m fa" xml:space="preserve">country</text>
