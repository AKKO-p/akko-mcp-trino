<text x="514" y="170" font-size="14" class="mu" xml:space="preserve">European customers only (row filter),</text>
<text x="514" y="188" font-size="14" class="mu" xml:space="preserve">e-mails masked (column mask).</text>
<text x="514" y="218" font-size="12" class="m fa" xml:space="preserve">id</text>
<text x="544" y="218" font-size="12" class="m fa" xml:space="preserve">full_name</text>
<text x="654" y="218" font-size="12" class="m fa" xml:space="preserve">email</text>
<text x="780" y="218" font-size="12" class="m fa" xml:space="preserve">country</text>
