<svg xmlns="http://www.w3.org/2000/svg" width="880" height="682" viewBox="0 0 880 682" role="img" aria-labelledby="t d">
<title id="t">Who sees what</title>
<desc id="d">The same query by three sandbox users. alice_admin gets the 10 customers in clear. carol_analyst gets the 5 European customers with masked e-mails. dave_viewer is refused by Trino: Access Denied: Cannot select from columns [country, full_name, id, email] in table or view demo.crm.customers.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'DejaVu Sans', sans-serif;fill:#0f1b2d}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.mu{fill:#4d5a70} .fa{fill:#7d8798} .ac{fill:#4a42d4} .am{fill:#a16207}
.ok{fill:#15803d} .no{fill:#b42318} .b{font-weight:600} .bb{font-weight:700}
.ln{fill:none;stroke:#4d5a70;stroke-width:1.5} .dash{stroke-dasharray:4 4}
.grid{stroke:#e3e6ec;stroke-width:1}
</style>
<path d="M28.5 0.5H851.5A28 28 0 0 1 879.5 28.5V667.5A14 14 0 0 1 865.5 681.5H14.5A14 14 0 0 1 0.5 667.5V28.5A28 28 0 0 1 28.5 0.5Z" fill="#f6f7f9" stroke="#e3e6ec"/>
<rect x="260" y="-20" width="360" height="38" rx="19" fill="#ffffff" stroke="#e3e6ec"/>
<rect x="32" y="136" width="448" height="454" rx="14" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<rect x="496" y="136" width="352" height="252" rx="14" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<rect x="496" y="404" width="352" height="186" rx="14" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">Who sees what?</text>
<text x="440.0" y="90" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">The same query, through the same agent and the same server.</text>
<text x="440.0" y="114" font-size="13" text-anchor="middle" class="m" xml:space="preserve">SELECT full_name, email, country FROM demo.crm.customers ORDER BY id</text>
<text x="50" y="168" font-size="16" class="m bb" xml:space="preserve">alice_admin</text>
<rect x="167.8" y="153" width="52.0" height="21" rx="10.5" fill="#ecebfb"/>
<text x="193.8" y="168" font-size="12" text-anchor="middle" class="m ac" xml:space="preserve">admin</text>
<text x="50" y="192" font-size="14" class="mu" xml:space="preserve">Every row, every column in clear.</text>
<text x="50" y="222" font-size="12" class="m fa" xml:space="preserve">full_name</text>
<text x="182" y="222" font-size="12" class="m fa" xml:space="preserve">email</text>
<text x="404" y="222" font-size="12" class="m fa" xml:space="preserve">country</text>
<path class="grid" d="M44 231H468"/>
<text x="50" y="257" font-size="14" xml:space="preserve">Lena Vogel</text>
<text x="182" y="257" font-size="12.5" class="m" xml:space="preserve">lena.vogel@example.com</text>
<text x="404" y="257" font-size="12.5" class="m" xml:space="preserve">DE</text>
<text x="50" y="292" font-size="14" xml:space="preserve">Hugo Martin</text>
<text x="182" y="292" font-size="12.5" class="m" xml:space="preserve">hugo.martin@example.com</text>
<text x="404" y="292" font-size="12.5" class="m" xml:space="preserve">FR</text>
<text x="50" y="327" font-size="14" xml:space="preserve">Sofia Ruiz</text>
<text x="182" y="327" font-size="12.5" class="m" xml:space="preserve">sofia.ruiz@example.org</text>
<text x="404" y="327" font-size="12.5" class="m" xml:space="preserve">ES</text>
<text x="50" y="362" font-size="14" xml:space="preserve">Noah Bennett</text>
<text x="182" y="362" font-size="12.5" class="m" xml:space="preserve">noah.bennett@example.com</text>
<text x="404" y="362" font-size="12.5" class="m" xml:space="preserve">US</text>
<text x="50" y="397" font-size="14" xml:space="preserve">Giulia Conti</text>
<text x="182" y="397" font-size="12.5" class="m" xml:space="preserve">giulia.conti@example.org</text>
<text x="404" y="397" font-size="12.5" class="m" xml:space="preserve">IT</text>
<text x="50" y="432" font-size="14" xml:space="preserve">Kenji Sato</text>
<text x="182" y="432" font-size="12.5" class="m" xml:space="preserve">kenji.sato@example.com</text>
<text x="404" y="432" font-size="12.5" class="m" xml:space="preserve">JP</text>
<text x="50" y="467" font-size="14" xml:space="preserve">Emma de Vries</text>
<text x="182" y="467" font-size="12.5" class="m" xml:space="preserve">emma.devries@example.org</text>
<text x="404" y="467" font-size="12.5" class="m" xml:space="preserve">NL</text>
<text x="50" y="502" font-size="14" xml:space="preserve">Lucas Almeida</text>
<text x="182" y="502" font-size="12.5" class="m" xml:space="preserve">lucas.almeida@example.com</text>
<text x="404" y="502" font-size="12.5" class="m" xml:space="preserve">BR</text>
<text x="50" y="537" font-size="14" xml:space="preserve">Olivia Clarke</text>
<text x="182" y="537" font-size="12.5" class="m" xml:space="preserve">olivia.clarke@example.org</text>
<text x="404" y="537" font-size="12.5" class="m" xml:space="preserve">GB</text>
<text x="50" y="572" font-size="14" xml:space="preserve">Chloe Tremblay</text>
<text x="182" y="572" font-size="12.5" class="m" xml:space="preserve">chloe.tremblay@example.com</text>
<text x="404" y="572" font-size="12.5" class="m" xml:space="preserve">CA</text>
<text x="514" y="168" font-size="16" class="m bb" xml:space="preserve">carol_analyst</text>
<rect x="651.4" y="153" width="67.19999999999999" height="21" rx="10.5" fill="#ecebfb"/>
<text x="685.0" y="168" font-size="12" text-anchor="middle" class="m ac" xml:space="preserve">analyst</text>
<text x="514" y="192" font-size="14" class="mu" xml:space="preserve">European customers only (row filter),</text>
<text x="514" y="210" font-size="14" class="mu" xml:space="preserve">e-mails masked (column mask).</text>
<text x="514" y="240" font-size="12" class="m fa" xml:space="preserve">full_name</text>
<text x="636" y="240" font-size="12" class="m fa" xml:space="preserve">email</text>
<text x="776" y="240" font-size="12" class="m fa" xml:space="preserve">country</text>
<path class="grid" d="M508 249H836"/>
<text x="514" y="266" font-size="14" xml:space="preserve">Lena Vogel</text>
<text x="636" y="266" font-size="12.5" class="m am" xml:space="preserve">***@example.com</text>
<text x="776" y="266" font-size="12.5" class="m" xml:space="preserve">DE</text>
<text x="514" y="292" font-size="14" xml:space="preserve">Hugo Martin</text>
<text x="636" y="292" font-size="12.5" class="m am" xml:space="preserve">***@example.com</text>
<text x="776" y="292" font-size="12.5" class="m" xml:space="preserve">FR</text>
<text x="514" y="318" font-size="14" xml:space="preserve">Sofia Ruiz</text>
<text x="636" y="318" font-size="12.5" class="m am" xml:space="preserve">***@example.org</text>
<text x="776" y="318" font-size="12.5" class="m" xml:space="preserve">ES</text>
<text x="514" y="344" font-size="14" xml:space="preserve">Giulia Conti</text>
<text x="636" y="344" font-size="12.5" class="m am" xml:space="preserve">***@example.org</text>
<text x="776" y="344" font-size="12.5" class="m" xml:space="preserve">IT</text>
<text x="514" y="370" font-size="14" xml:space="preserve">Emma de Vries</text>
<text x="636" y="370" font-size="12.5" class="m am" xml:space="preserve">***@example.org</text>
<text x="776" y="370" font-size="12.5" class="m" xml:space="preserve">NL</text>
<text x="514" y="436" font-size="16" class="m bb" xml:space="preserve">dave_viewer</text>
<rect x="631.8" y="421" width="59.599999999999994" height="21" rx="10.5" fill="#ecebfb"/>
<text x="661.5999999999999" y="436" font-size="12" text-anchor="middle" class="m ac" xml:space="preserve">viewer</text>
<rect x="514" y="452" width="316" height="74" rx="10" fill="#fbeaea"/>
<text x="526" y="474" font-size="12.5" class="m no" xml:space="preserve">Access Denied: Cannot select from</text>
<text x="526" y="493" font-size="12.5" class="m no" xml:space="preserve">columns [country, full_name, id, email]</text>
<text x="526" y="512" font-size="12.5" class="m no" xml:space="preserve">in table or view demo.crm.customers</text>
<text x="514" y="550" font-size="13.5" class="mu" xml:space="preserve">Searched with search_columns <tspan class="m">"email"</tspan>,</text>
<text x="514" y="570" font-size="13.5" class="mu" xml:space="preserve">he gets no match, and the search is complete.</text>
<text x="440.0" y="632" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">These three answers come from Trino, with the sandbox's OPA policy.</text>
<text x="440.0" y="654" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">The MCP server copies no rule: it only passes on each person's identity.</text>
</svg>
