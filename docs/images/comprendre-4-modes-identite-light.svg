<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1000" viewBox="0 0 880 1000" role="img" aria-labelledby="t d">
<title id="t">Les quatre modes d’identité</title>
<desc id="d">Trois questions choisissent le mode, puis les quatre modes sur la même grille (MCP host, serveur, Trino) : jwt, par défaut, impersonation, oauth2 sur un poste de travail, et service, en orange, un seul compte pour tous.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'DejaVu Sans', sans-serif;fill:#0f1b2d}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.mu{fill:#4d5a70} .fa{fill:#7d8798} .ac{fill:#4a42d4} .am{fill:#a16207}
.ok{fill:#15803d} .no{fill:#b42318} .b{font-weight:600} .bb{font-weight:700}
.ln{fill:none;stroke:#4d5a70;stroke-width:1.5} .dash{stroke-dasharray:4 4}
.grid{stroke:#e3e6ec;stroke-width:1}
</style>
<path d="M28.5 0.5H851.5A28 28 0 0 1 879.5 28.5V985.5A14 14 0 0 1 865.5 999.5H14.5A14 14 0 0 1 0.5 985.5V28.5A28 28 0 0 1 28.5 0.5Z" fill="#f6f7f9" stroke="#e3e6ec"/>
<rect x="260" y="-20" width="360" height="38" rx="19" fill="#ffffff" stroke="#e3e6ec"/>
<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">Quel mode d’identité pour vous ?</text>
<text x="440.0" y="90" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">Répondez dans l’ordre. Les quatre modes suivent la même grille, pour voir ce qui change.</text>
<rect x="32" y="116" width="816" height="66" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="50" y="144.0" font-size="15" class="bb fa" xml:space="preserve">1.</text>
<text x="74" y="144.0" font-size="15" xml:space="preserve">Votre identity provider sait-il échanger des tokens (RFC 8693, comme</text>
<text x="74" y="164.0" font-size="15" xml:space="preserve">Keycloak 26) ?</text>
<rect x="735.6" y="135.0" width="94.39999999999999" height="28" rx="14" fill="#ecebfb"/>
<text x="782.8000000000001" y="154.0" font-size="13.5" text-anchor="middle" class="ac" xml:space="preserve">Oui → <tspan class="m b">jwt</tspan></text>
<path class="ln" d="M56 184V205"/>
<path class="ln" d="M51 199L56 205L61 199"/>
<text x="68" y="200" font-size="12.5" class="mu" xml:space="preserve">Non</text>
<rect x="32" y="208" width="816" height="66" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="50" y="236.0" font-size="15" class="bb fa" xml:space="preserve">2.</text>
<text x="74" y="236.0" font-size="15" xml:space="preserve">Trino peut-il autoriser un service account à agir au nom des</text>
<text x="74" y="256.0" font-size="15" xml:space="preserve">utilisateurs ?</text>
<rect x="659.6" y="227.0" width="170.4" height="28" rx="14" fill="#ecebfb"/>
<text x="744.8000000000001" y="246.0" font-size="13.5" text-anchor="middle" class="ac" xml:space="preserve">Oui → <tspan class="m b">impersonation</tspan></text>
<path class="ln" d="M56 276V297"/>
<path class="ln" d="M51 291L56 297L61 291"/>
<text x="68" y="292" font-size="12.5" class="mu" xml:space="preserve">Non</text>
<rect x="32" y="300" width="816" height="66" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="50" y="328.0" font-size="15" class="bb fa" xml:space="preserve">3.</text>
<text x="74" y="328.0" font-size="15" xml:space="preserve">Le serveur tourne-t-il sur le poste d’une seule personne,</text>
<text x="74" y="348.0" font-size="15" xml:space="preserve">avec la connexion OAuth2 de Trino (Claude Desktop, Cursor) ?</text>
<rect x="705.2" y="319.0" width="124.8" height="28" rx="14" fill="#fbf3e3"/>
<text x="767.6" y="338.0" font-size="13.5" text-anchor="middle" class="am" xml:space="preserve">Non → <tspan class="m b">service</tspan></text>
<rect x="578.0" y="319.0" width="117.19999999999999" height="28" rx="14" fill="#ecebfb"/>
<text x="636.6" y="338.0" font-size="13.5" text-anchor="middle" class="ac" xml:space="preserve">Oui → <tspan class="m b">oauth2</tspan></text>
<rect x="32" y="388" width="392" height="282" rx="14" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="50" y="420" font-size="18" class="m bb" xml:space="preserve">jwt</text>
<rect x="94.4" y="404" width="92.0" height="22" rx="11" fill="#ecebfb"/>
<text x="140.4" y="419" font-size="12" text-anchor="middle" class="m ac" xml:space="preserve">par défaut</text>
<text x="50" y="446" font-size="14.5" class="mu" xml:space="preserve">Trino voit <tspan class="b" style="fill:#0f1b2d">l’utilisateur</tspan></text>
<rect x="50.4" y="508.0" width="86.39999999999999" height="38.4" rx="8" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="93.6" y="531.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">MCP host</text>
<rect x="184.8" y="508.0" width="86.39999999999999" height="38.4" rx="8" fill="#ecebfb" stroke="#4a42d4" stroke-width="1"/>
<text x="228.0" y="531.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">serveur</text>
<rect x="319.2" y="508.0" width="86.39999999999999" height="38.4" rx="8" fill="#f6f7f9" stroke="#0f1b2d" stroke-width="1"/>
<text x="362.4" y="531.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">Trino</text>
<path class="ln" d="M273.6 527.2H317.0"/>
<path class="ln" d="M311.0 522.2L317.0 527.2L311.0 532.2"/>
<path class="ln" d="M139.2 527.2H182.6"/>
<path class="ln" d="M176.6 522.2L182.6 527.2L176.6 532.2"/>
<rect x="199.2" y="472.0" width="57.599999999999994" height="24.0" rx="8" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="228.0" y="488.3" font-size="12" text-anchor="middle" xml:space="preserve">IdP</text>
<path class="ln dash" d="M228.0 496.0V508.0"/>
<text x="160.8" y="568.0" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">token de l’utilisateur</text>
<text x="295.2" y="568.0" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">token échangé</text>
<text x="326.4" y="487.6" font-size="12" text-anchor="middle" class="fa" xml:space="preserve">échange de token</text>
<text x="50" y="612" font-size="13.5" class="mu" xml:space="preserve"><tspan class="b" style="fill:#0f1b2d">Le plus sûr.</tspan> Le serveur ne transmet jamais le token</text>
<text x="50" y="631" font-size="13.5" class="mu" xml:space="preserve">reçu : il en obtient un autre, émis pour Trino.</text>
<rect x="456" y="388" width="392" height="282" rx="14" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="474" y="420" font-size="18" class="m bb" xml:space="preserve">impersonation</text>
<text x="474" y="446" font-size="14.5" class="mu" xml:space="preserve">Trino voit <tspan class="b" style="fill:#0f1b2d">l’utilisateur</tspan></text>
<rect x="474.4" y="508.0" width="86.39999999999999" height="38.4" rx="8" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="517.6" y="531.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">MCP host</text>
<rect x="608.8" y="508.0" width="86.39999999999999" height="38.4" rx="8" fill="#ecebfb" stroke="#4a42d4" stroke-width="1"/>
<text x="652.0" y="531.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">serveur</text>
<rect x="743.2" y="508.0" width="86.39999999999999" height="38.4" rx="8" fill="#f6f7f9" stroke="#0f1b2d" stroke-width="1"/>
<text x="786.4" y="531.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">Trino</text>
<path class="ln" d="M697.6 527.2H741.0"/>
<path class="ln" d="M735.0 522.2L741.0 527.2L735.0 532.2"/>
<path class="ln" d="M563.2 527.2H606.6"/>
<path class="ln" d="M600.6 522.2L606.6 527.2L600.6 532.2"/>
<text x="584.8" y="568.0" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">token vérifié</text>
<text x="719.2" y="568.0" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">compte du serveur,</text>
<text x="719.2" y="582.4" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">au nom de l’utilisateur</text>
<text x="474" y="612" font-size="13.5" class="mu" xml:space="preserve"><tspan class="b" style="fill:#0f1b2d">Sans échange de token.</tspan> Trino autorise ce seul compte à</text>
<text x="474" y="631" font-size="13.5" class="mu" xml:space="preserve">agir au nom des autres. Le nom vient toujours du token</text>
<text x="474" y="650" font-size="13.5" class="mu" xml:space="preserve">vérifié.</text>
<rect x="32" y="686" width="392" height="282" rx="14" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="50" y="718" font-size="18" class="m bb" xml:space="preserve">oauth2</text>
<rect x="126.80000000000001" y="702" width="135.2" height="22" rx="11" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="194.4" y="717" font-size="12" text-anchor="middle" class="m mu" xml:space="preserve">poste de travail</text>
<text x="50" y="744" font-size="14.5" class="mu" xml:space="preserve">Trino voit <tspan class="b" style="fill:#0f1b2d">la personne connectée</tspan></text>
<rect x="50.4" y="806.0" width="86.39999999999999" height="38.4" rx="8" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="93.6" y="829.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">navigateur</text>
<rect x="184.8" y="806.0" width="86.39999999999999" height="38.4" rx="8" fill="#ecebfb" stroke="#4a42d4" stroke-width="1"/>
<text x="228.0" y="829.7" font-size="12.5" text-anchor="middle" xml:space="preserve">serveur local</text>
<rect x="319.2" y="806.0" width="86.39999999999999" height="38.4" rx="8" fill="#f6f7f9" stroke="#0f1b2d" stroke-width="1"/>
<text x="362.4" y="829.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">Trino</text>
<path class="ln" d="M273.6 825.2H317.0"/>
<path class="ln" d="M311.0 820.2L317.0 825.2L311.0 830.2"/>
<path class="ln dash" d="M93.6 803.6C93.6 772.4 362.4 772.4 362.4 802.6"/>
<path class="ln" d="M357.4 796.6L362.4 802.6L367.4 796.6"/>
<text x="228.0" y="768.8" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">connexion à Trino</text>
<text x="295.2" y="866.0" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">aucun nom envoyé</text>
<text x="160.8" y="866.0" font-size="12" text-anchor="middle" class="fa" xml:space="preserve">stdio seulement</text>
<text x="50" y="910" font-size="13.5" class="mu" xml:space="preserve"><tspan class="b" style="fill:#0f1b2d">Sur le poste.</tspan> La connexion navigateur de Trino, sans</text>
<text x="50" y="929" font-size="13.5" class="mu" xml:space="preserve">identity provider à configurer côté serveur.</text>
<rect x="456" y="686" width="392" height="282" rx="14" fill="#ffffff" stroke="#a16207" stroke-width="1.6"/>
<text x="474" y="718" font-size="18" class="m bb" xml:space="preserve">service</text>
<rect x="561.6" y="702" width="128.0" height="22" rx="11" fill="#fbf3e3"/>
<text x="625.6" y="717" font-size="12" text-anchor="middle" class="m am" xml:space="preserve">à nommer exprès</text>
<text x="474" y="744" font-size="14.5" class="mu" xml:space="preserve">Trino voit <tspan class="b" style="fill:#0f1b2d">un seul compte</tspan>, pour tous</text>
<rect x="474.4" y="782.0" width="86.39999999999999" height="28.799999999999997" rx="8" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="517.6" y="800.7" font-size="12" text-anchor="middle" xml:space="preserve">personne A</text>
<rect x="474.4" y="839.6" width="86.39999999999999" height="28.799999999999997" rx="8" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/>
<text x="517.6" y="858.3" font-size="12" text-anchor="middle" xml:space="preserve">personne B</text>
<path class="ln" d="M563.2 796.4L605.2 818.0"/>
<path class="ln" d="M563.2 854.0L605.2 832.4"/>
<rect x="608.8" y="806.0" width="86.39999999999999" height="38.4" rx="8" fill="#fbf3e3" stroke="#a16207" stroke-width="1"/>
<text x="652.0" y="829.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">serveur</text>
<rect x="743.2" y="806.0" width="86.39999999999999" height="38.4" rx="8" fill="#f6f7f9" stroke="#0f1b2d" stroke-width="1"/>
<text x="786.4" y="829.9" font-size="13" text-anchor="middle" class="b" xml:space="preserve">Trino</text>
<path class="ln" d="M697.6 825.2H741.0"/>
<path class="ln" d="M735.0 820.2L741.0 825.2L735.0 830.2"/>
<text x="719.2" y="866.0" font-size="12" text-anchor="middle" class="mu" xml:space="preserve">en mcp-reader</text>
<text x="474" y="910" font-size="13.5" class="mu" xml:space="preserve"><tspan class="b" style="fill:#0f1b2d">Les mêmes droits pour tous,</tspan> en lecture seule. Le</text>
<text x="474" y="929" font-size="13.5" class="mu" xml:space="preserve">serveur l’annonce par un avertissement au démarrage.</text>
</svg>
