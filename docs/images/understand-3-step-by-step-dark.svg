<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1130" viewBox="0 0 880 1130" role="img" aria-labelledby="t d">
<title id="t">The agent, step by step</title>
<desc id="d">Six steps: the question, search_columns with revenue customer, no column with both words, matches word by word with their words, describe_schema, then execute_query.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'DejaVu Sans', sans-serif;fill:#e8ecf4}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.mu{fill:#a6b0c3} .fa{fill:#7a859b} .ac{fill:#8f88ff} .am{fill:#e0a43a}
.ok{fill:#4ade80} .no{fill:#f87171} .b{font-weight:600} .bb{font-weight:700}
.ln{fill:none;stroke:#a6b0c3;stroke-width:1.5} .dash{stroke-dasharray:4 4}
.grid{stroke:#24304a;stroke-width:1}
</style>
<path d="M28.5 0.5H851.5A28 28 0 0 1 879.5 28.5V1115.5A14 14 0 0 1 865.5 1129.5H14.5A14 14 0 0 1 0.5 1115.5V28.5A28 28 0 0 1 28.5 0.5Z" fill="#131b2c" stroke="#24304a"/>
<rect x="260" y="-20" width="360" height="38" rx="19" fill="#0d1117" stroke="#24304a"/>
<path d="M62 131V939" stroke="#24304a" stroke-width="2"/>
<circle cx="62" cy="131" r="17" fill="#8f88ff"/>
<text x="62" y="136.5" font-size="15" text-anchor="middle" class="bb" fill="#0c1220" style="fill:#0c1220" xml:space="preserve">1</text>
<circle cx="62" cy="254" r="17" fill="#8f88ff"/>
<text x="62" y="259.5" font-size="15" text-anchor="middle" class="bb" fill="#0c1220" style="fill:#0c1220" xml:space="preserve">2</text>
<circle cx="62" cy="417" r="17" fill="#8f88ff"/>
<text x="62" y="422.5" font-size="15" text-anchor="middle" class="bb" fill="#0c1220" style="fill:#0c1220" xml:space="preserve">3</text>
<circle cx="62" cy="561" r="17" fill="#8f88ff"/>
<text x="62" y="566.5" font-size="15" text-anchor="middle" class="bb" fill="#0c1220" style="fill:#0c1220" xml:space="preserve">4</text>
<circle cx="62" cy="816" r="17" fill="#8f88ff"/>
<text x="62" y="821.5" font-size="15" text-anchor="middle" class="bb" fill="#0c1220" style="fill:#0c1220" xml:space="preserve">5</text>
<circle cx="62" cy="939" r="17" fill="#8f88ff"/>
<text x="62" y="944.5" font-size="15" text-anchor="middle" class="bb" fill="#0c1220" style="fill:#0c1220" xml:space="preserve">6</text>
<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">How the agent finds the right column</text>
<text x="440.0" y="90" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">A real question, tool call by tool call. The search answer is the server's, word for word.</text>
<rect x="104" y="120" width="49.6" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="137" font-size="13" class="ac b" xml:space="preserve">user</text>
<text x="104" y="168" font-size="18" class="bb" xml:space="preserve">“What is the revenue per customer?”</text>
<text x="104" y="192" font-size="14.5" class="mu" xml:space="preserve">The agent does not know the tables, and it must not guess column names.</text>
<rect x="104" y="243" width="130.60000000000002" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="260" font-size="13" class="m ac b" xml:space="preserve">search_columns</text>
<text x="244.60000000000002" y="260" font-size="13" class="fa" xml:space="preserve">searches every catalog the person may see</text>
<text x="104" y="291" font-size="18" class="bb" xml:space="preserve">It searches with two words: revenue customer</text>
<text x="104" y="315" font-size="14.5" class="mu" xml:space="preserve">One tool call over every catalog it is allowed to see, instead of walking them one by one.</text>
<rect x="104" y="336" width="300" height="34" rx="10" fill="#0f1626"/>
<text x="118" y="358" font-size="13" class="m" xml:space="preserve"><tspan class="ac">"text"</tspan><tspan class="mu">: </tspan><tspan class="ok">"revenue customer"</tspan></text>
<rect x="104" y="406" width="94.0" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="423" font-size="13" class="ac b" xml:space="preserve">the server</text>
<text x="104" y="454" font-size="18" class="bb" xml:space="preserve">No column holds both words together</text>
<text x="104" y="478" font-size="14.5" class="mu" xml:space="preserve">Without this second pass, the agent got “nothing found” and Mistral stopped there. Now the server</text>
<text x="104" y="499" font-size="14.5" class="mu" xml:space="preserve">searches each word on its own.</text>
<rect x="104" y="550" width="153.20000000000002" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="567" font-size="13" class="ac b" xml:space="preserve">the server answers</text>
<text x="104" y="598" font-size="18" class="bb" xml:space="preserve">Each match says which word it found</text>
<text x="104" y="622" font-size="14.5" class="mu" xml:space="preserve">The server adds "partial": true, so the agent knows these are partial matches.</text>
<rect x="104" y="645" width="232" height="58" rx="10" fill="#131b2c" stroke="#4ade80" stroke-width="1.6"/>
<text x="116" y="668" font-size="13" class="m" xml:space="preserve">crm.transactions.amount</text>
<rect x="116" y="677" width="67.80000000000001" height="18" rx="9" fill="#2a2112"/>
<text x="149.9" y="690" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">revenue</text>
<rect x="348" y="645" width="232" height="58" rx="10" fill="#131b2c" stroke="#4ade80" stroke-width="1.6"/>
<text x="360" y="668" font-size="13" class="m" xml:space="preserve">crm.accounts.customer_id</text>
<rect x="360" y="677" width="75.2" height="18" rx="9" fill="#2a2112"/>
<text x="397.6" y="690" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">customer</text>
<rect x="592" y="645" width="232" height="58" rx="10" fill="#131b2c" stroke="#24304a" stroke-width="1"/>
<text x="604" y="668" font-size="13" class="m" xml:space="preserve">crm.customers.segment</text>
<rect x="604" y="677" width="75.2" height="18" rx="9" fill="#2a2112"/>
<text x="641.6" y="690" font-size="11.5" text-anchor="middle" class="m am" xml:space="preserve">customer</text>
<rect x="104" y="715" width="744" height="54" rx="10" fill="#0f1626"/>
<text x="118" y="736" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"comment"</tspan><tspan class="mu">: </tspan><tspan class="ok">"Booked amount in the account currency: the revenue of a sale"</tspan><tspan class="mu">,</tspan></text>
<text x="118" y="756" font-size="12.5" class="m" xml:space="preserve"><tspan class="ac">"words"</tspan><tspan class="mu">: [</tspan><tspan class="ok">"revenue"</tspan><tspan class="mu">]  …  </tspan><tspan class="ac">"partial"</tspan><tspan class="mu">: </tspan><tspan class="ok">true</tspan></text>
<rect x="104" y="805" width="138.5" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="822" font-size="13" class="m ac b" xml:space="preserve">describe_schema</text>
<text x="252.5" y="822" font-size="13" class="fa" xml:space="preserve">a whole schema in one call</text>
<text x="104" y="853" font-size="18" class="bb" xml:space="preserve">The columns of crm, in one tool call</text>
<text x="104" y="877" font-size="14.5" class="mu" xml:space="preserve">The agent sees the join: transactions.account_id to accounts.id, then accounts.customer_id.</text>
<rect x="104" y="928" width="122.7" height="24" rx="8" fill="#1d1d44"/>
<text x="114" y="945" font-size="13" class="m ac b" xml:space="preserve">execute_query</text>
<text x="236.7" y="945" font-size="13" class="fa" xml:space="preserve">runs the query as the person</text>
<text x="104" y="976" font-size="18" class="bb" xml:space="preserve">SUM(amount) per customer_id</text>
<text x="104" y="1000" font-size="14.5" class="mu" xml:space="preserve">The query runs under the person's identity. Trino applies their rights, and the agent names the</text>
<text x="104" y="1021" font-size="14.5" class="mu" xml:space="preserve">columns it used.</text>
<path d="M105.5 1044V1092" stroke="#8f88ff" stroke-width="3"/>
<text x="118" y="1062" font-size="14.5" xml:space="preserve">The revenue of each customer, computed on transactions.amount, joined through</text>
<text x="118" y="1083" font-size="14.5" xml:space="preserve">accounts.customer_id.</text>
</svg>
