<text x="526" y="474" font-size="12.5" class="m no" xml:space="preserve">Access Denied: Cannot select from</text>
<text x="526" y="493" font-size="12.5" class="m no" xml:space="preserve">columns [country, full_name, id, email]</text>
<text x="526" y="512" font-size="12.5" class="m no" xml:space="preserve">in table or view demo.crm.customers</text>
<text x="514" y="550" font-size="13.5" class="mu" xml:space="preserve">Cherché avec search_columns « <tspan class="m">email</tspan> »,</text>
<text x="514" y="570" font-size="13.5" class="mu" xml:space="preserve">aucun résultat, et la recherche est complète.</text>
<text x="440.0" y="632" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">Ces réponses viennent de ce que Trino laisse voir à chacun, avec la policy OPA du sandbox.</text>
<text x="440.0" y="654" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">Le serveur MCP ne recopie aucune règle : il transmet seulement l’identité de chacun.</text>
