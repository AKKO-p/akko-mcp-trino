<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">Qui voit quoi ?</text>
<text x="440.0" y="90" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">La même requête, par le même client MCP et le même serveur.</text>
<text x="440.0" y="114" font-size="13" text-anchor="middle" class="m" xml:space="preserve">SELECT full_name, email, country FROM demo.crm.customers ORDER BY id</text>
