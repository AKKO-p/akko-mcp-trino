<svg xmlns="http://www.w3.org/2000/svg" width="880" height="588" viewBox="0 0 880 588" role="img" aria-labelledby="t d">
<title id="t">The problem: an agent behind a broad service account</title>
<desc id="d">Two side by side panels. With a service account with broad rights, Trino sees mcp-svc and returns 10 customers with e-mails in clear. With akko-mcp-trino, Trino sees carol_analyst and returns 5 European customers with e-mails masked.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'DejaVu Sans', sans-serif;fill:#0f1b2d}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.mu{fill:#4d5a70} .fa{fill:#7d8798} .ac{fill:#4a42d4} .am{fill:#a16207}
.ok{fill:#15803d} .no{fill:#b42318} .b{font-weight:600} .bb{font-weight:700}
.ln{fill:none;stroke:#4d5a70;stroke-width:1.5} .dash{stroke-dasharray:4 4}
.grid{stroke:#e3e6ec;stroke-width:1}
</style>
<path d="M28.5 0.5H851.5A28 28 0 0 1 879.5 28.5V573.5A14 14 0 0 1 865.5 587.5H14.5A14 14 0 0 1 0.5 573.5V28.5A28 28 0 0 1 28.5 0.5Z" fill="#f6f7f9" stroke="#e3e6ec"/>
<rect x="260" y="-20" width="360" height="38" rx="19" fill="#ffffff" stroke="#e3e6ec"/>
<text x="440.0" y="64" font-size="21" text-anchor="middle" class="bb" xml:space="preserve">Carol, an analyst, asks for the list of customers</text>
<rect x="32" y="92" width="396" height="420" rx="18" fill="#ffffff" stroke="#b42318" stroke-width="1.2"/>
<text x="230.0" y="124" font-size="16" text-anchor="middle" class="bb no" xml:space="preserve">With a service account with broad rights</text>
<rect x="80.0" y="142" width="300" height="54" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="230.0" y="166.0" font-size="15" text-anchor="middle" class="b" xml:space="preserve">Carol</text>
<text x="230.0" y="185.0" font-size="13" text-anchor="middle" class="m mu" xml:space="preserve">carol_analyst</text>
<path class="ln" d="M230.0 196V231"/>
<path class="ln" d="M225.0 225L230.0 231L235.0 225"/>
<text x="242.0" y="219" font-size="13" class="mu" xml:space="preserve">her question</text>
<rect x="80.0" y="232" width="300" height="54" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="230.0" y="256.0" font-size="15" text-anchor="middle" class="b" xml:space="preserve">AI agent and MCP server</text>
<text x="230.0" y="275.0" font-size="13" text-anchor="middle" class="m mu" xml:space="preserve">connected as mcp-svc</text>
<path class="ln" d="M230.0 286V321"/>
<path class="ln" d="M225.0 315L230.0 321L235.0 315"/>
<text x="242.0" y="309" font-size="13" class="mu" xml:space="preserve">query as mcp-svc</text>
<rect x="80.0" y="322" width="300" height="54" rx="12" fill="#fbeaea" stroke="#b42318" stroke-width="1"/>
<text x="230.0" y="346.0" font-size="15" text-anchor="middle" class="b" xml:space="preserve">Trino, the query engine</text>
<text x="230.0" y="365.0" font-size="13" text-anchor="middle" class="m mu" xml:space="preserve">sees mcp-svc</text>
<path class="ln" d="M230.0 376V411"/>
<path class="ln" d="M225.0 405L230.0 411L235.0 405"/>
<text x="242.0" y="399" font-size="13" class="mu" xml:space="preserve">answer</text>
<rect x="80.0" y="412" width="300" height="80" rx="12" fill="#fbeaea"/>
<text x="230.0" y="446" font-size="17" text-anchor="middle" class="bb no" xml:space="preserve">10 customers, e-mails in clear</text>
<text x="230.0" y="472" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">Her rules no longer apply</text>
<rect x="452" y="92" width="396" height="420" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<text x="650.0" y="124" font-size="16" text-anchor="middle" class="bb ok" xml:space="preserve">With akko-mcp-trino</text>
<rect x="500.0" y="142" width="300" height="54" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/>
<text x="650.0" y="166.0" font-size="15" text-anchor="middle" class="b" xml:space="preserve">Carol</text>
<text x="650.0" y="185.0" font-size="13" text-anchor="middle" class="m mu" xml:space="preserve">carol_analyst</text>
<path class="ln" d="M650.0 196V231"/>
<path class="ln" d="M645.0 225L650.0 231L655.0 225"/>
<text x="662.0" y="219" font-size="13" class="mu" xml:space="preserve">her question and her token</text>
<rect x="500.0" y="232" width="300" height="54" rx="12" fill="#ecebfb" stroke="#4a42d4" stroke-width="1"/>
<text x="650.0" y="256.0" font-size="15" text-anchor="middle" class="b" xml:space="preserve">AI agent and akko-mcp-trino</text>
<text x="650.0" y="275.0" font-size="13" text-anchor="middle" class="m mu" xml:space="preserve">verifies Carol's token</text>
<path class="ln" d="M650.0 286V321"/>
<path class="ln" d="M645.0 315L650.0 321L655.0 315"/>
<text x="662.0" y="309" font-size="13" class="mu" xml:space="preserve">query as carol_analyst</text>
<rect x="500.0" y="322" width="300" height="54" rx="12" fill="#e7f4ec" stroke="#15803d" stroke-width="1"/>
<text x="650.0" y="346.0" font-size="15" text-anchor="middle" class="b" xml:space="preserve">Trino, the query engine</text>
<text x="650.0" y="365.0" font-size="13" text-anchor="middle" class="m mu" xml:space="preserve">sees carol_analyst</text>
<path class="ln" d="M650.0 376V411"/>
<path class="ln" d="M645.0 405L650.0 411L655.0 405"/>
<text x="662.0" y="399" font-size="13" class="mu" xml:space="preserve">answer</text>
<rect x="500.0" y="412" width="300" height="80" rx="12" fill="#e7f4ec"/>
<text x="650.0" y="446" font-size="17" text-anchor="middle" class="bb ok" xml:space="preserve">5 European customers, e-mails masked</text>
<text x="650.0" y="472" font-size="14" text-anchor="middle" class="mu" xml:space="preserve">Trino applies her rules</text>
<text x="440.0" y="546" font-size="15" text-anchor="middle" class="b" xml:space="preserve">The rights are already written in Trino.</text>
<text x="440.0" y="568" font-size="15" text-anchor="middle" class="mu" xml:space="preserve">The only real work is to bring the right identity to it.</text>
</svg>
