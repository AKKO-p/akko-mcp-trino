name: release
# Tag v* → package on PyPI (trusted publishing) and image on GHCR.
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    # Runs once trusted publishing is configured on pypi.org for this repository
    # (Publishing → pending publisher: AKKO-p/akko-mcp-trino, release.yml, environment pypi)
    # and the repository variable PYPI_TRUSTED_PUBLISHING is set to "true".
    # Until then, releases are uploaded with twine from a maintainer's machine.
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
  registry:
    # Lists the server in the official MCP Registry once the package is on PyPI
    # (the registry checks the mcp-name marker in the PyPI description).
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Wait for PyPI to serve the version in server.json
        run: |
          v=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do curl -fsS "https://pypi.org/pypi/akko-mcp-trino/$v/json" >/dev/null && exit 0; sleep 20; done; exit 1
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
  provenance:
    # Signed build provenance and an SBOM for the wheel and sdist, attached to the release.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - run: gh release upload "${GITHUB_REF_NAME}" dist/* sbom.spdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/akko-p/akko-mcp-trino
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/akko-p/akko-mcp-trino
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
