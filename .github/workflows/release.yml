name: release
# Tag v* → both packages of the repository on PyPI (trusted publishing), the core and the Atlas
# provider, at the tag's version; provenance, the images and the Helm chart. Each image and the
# chart are signed by cosign without a key (the identity of this workflow at the tag, recorded in
# the public transparency log), and each image carries a signed SBOM attestation.
# Run by hand (workflow_dispatch) with an existing release tag, it only builds and
# pushes the image of that tag again, with the current workflow.
# The tag is checked first (scripts/release-tag.sh, from this workflow's commit): a version
# tag, present and reachable from main; every later job builds the commit it names. The jobs
# that build run no step with an OIDC token; signing and publishing are jobs of their own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (v<major>.<minor>.<patch>) whose image to push again"
        required: true
# Read-only by default; each job that publishes or signs adds what it needs.
permissions:
  contents: read
jobs:
  ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      ghcr: ${{ steps.names.outputs.ghcr }}
      charts: ${{ steps.names.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/release-tag.sh "$TAG" origin/main >> "$GITHUB_OUTPUT"
      # The GHCR names of this repository, in lower case as registries require: the image, and
      # the OCI repository of the chart (ghcr.io/<owner>/charts/<chart>).
      - id: names
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_OUTPUT"
  dist:
    # The sdists and the wheels of both packages, the core and the Atlas provider, built once
    # from the same tag by the locked tools and handed to the jobs that publish and sign them.
    if: github.event_name == 'push'
    needs: ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
      - id: lock
        run: bash scripts/lock.sh outputs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ steps.lock.outputs.python }}
      - run: pip install --require-hashes -r requirements/release.txt
      - run: |
          python -m build --no-isolation
          python -m build --no-isolation --outdir dist providers/atlas
          twine check dist/*
      - name: both packages carry the tag's version
        env:
          TAG: ${{ needs.ref.outputs.tag }}
        run: |
          v=${TAG#v}
          for f in "akko_mcp_trino-$v.tar.gz" "akko_mcp_trino-$v-py3-none-any.whl" \
                   "akko_mcp_trino_atlas-$v.tar.gz" "akko_mcp_trino_atlas-$v-py3-none-any.whl"; do
            test -f "dist/$f" || { echo "dist/$f is missing"; ls dist; exit 1; }
          done
          test "$(ls dist | wc -l)" -eq 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
  pypi:
    # Runs once trusted publishing is configured on pypi.org for this repository, for each of
    # the two projects, akko-mcp-trino and akko-mcp-trino-atlas
    # (Publishing → pending publisher: AKKO-p/akko-mcp-trino, release.yml, environment pypi)
    # and the repository variable PYPI_TRUSTED_PUBLISHING is set to "true".
    # Until then, releases are uploaded with twine from a maintainer's machine.
    if: github.event_name == 'push' && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    needs: dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
  registry:
    # Lists the server in the official MCP Registry once the package is on PyPI
    # (the registry checks the mcp-name marker in the PyPI description).
    needs: pypi
    runs-on: ubuntu-latest
    env:
      # mcp-publisher, an exact release; its archive must match this sha256, the line of
      # mcp-publisher_linux_amd64.tar.gz in that release's registry_<version>_checksums.txt.
      # Dependabot cannot follow it: to move it, set both from the new release (CONTRIBUTING.md).
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Wait for PyPI to serve the version in server.json
        run: |
          v=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do curl -fsS "https://pypi.org/pypi/akko-mcp-trino/$v/json" >/dev/null && exit 0; sleep 20; done; exit 1
      - name: Install mcp-publisher (exact version, checksum verified)
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
  provenance:
    # Signed build provenance and an SBOM for the wheels and sdists of the dist job, attached to
    # the release.
    if: github.event_name == 'push'
    needs: [ref, dist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: v3.1.4
      # A Sigstore bundle beside each package: cosign verify-blob checks it offline.
      - name: sign each package (cosign, keyless)
        run: for f in dist/*; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null; done
      - run: gh release upload "$TAG" dist/* sbom.spdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ref.outputs.tag }}
  image:
    needs: ref
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # This workflow's commit, then the checked tag in tag/: a tag from before
      # requirements/image.txt builds with its own image-requirements.txt (scripts/release-image.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
          path: tag
      - id: lock
        run: bash scripts/release-image.sh tag >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub too, once the repository variable DOCKERHUB_USERNAME and the
      # secret DOCKERHUB_TOKEN are set; without them the image goes to GHCR only.
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: |
            ${{ needs.ref.outputs.ghcr }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/akko-mcp-trino,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.ref.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: push
        with:
          context: tag
          platforms: ${{ steps.lock.outputs.platforms }}
          # The SBOM of each platform's image, as a BuildKit attestation manifest in the image's
          # index, beside the provenance attestation build-push-action adds by default
          # (provenance is left at that default).
          sbom: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  image-provenance:
    # The image's signed build provenance, in a job that runs nothing from the tag.
    needs: [ref, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.ref.outputs.ghcr }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
  image-ubi9:
    # The UBI 9 variant (Dockerfile.ubi9), under the same name with the -ubi9 suffix: X.Y.Z-ubi9,
    # X.Y-ubi9 and ubi9; latest, X.Y and X.Y.Z stay the Debian image's. Its wheelhouse comes from
    # the tag's locks (scripts/wheelhouse.sh, hashes checked), then the build runs with no
    # network, with its SBOM. linux/amd64 only: the platform its build and its checks were proven
    # on. A tag from before Dockerfile.ubi9 has no such variant.
    needs: ref
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
          path: tag
      - id: variant
        run: |
          if [ -f tag/Dockerfile.ubi9 ]; then echo build=true >> "$GITHUB_OUTPUT"
          else echo "::notice::this tag predates Dockerfile.ubi9: no UBI 9 image"; echo build=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.variant.outputs.build == 'true'
        name: the wheelhouse, from the tag's locks
        run: bash tag/scripts/wheelhouse.sh
      - if: steps.variant.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - if: steps.variant.outputs.build == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.variant.outputs.build == 'true' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.variant.outputs.build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: |
            ${{ needs.ref.outputs.ghcr }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/akko-mcp-trino,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.ref.outputs.tag }},suffix=-ubi9
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.ref.outputs.tag }},suffix=-ubi9
            type=raw,value=ubi9
      - if: steps.variant.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: push
        with:
          context: tag
          file: tag/Dockerfile.ubi9
          network: none
          platforms: linux/amd64
          # The SBOM, as for the Debian image.
          sbom: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  image-ubi9-provenance:
    # The UBI 9 image's signed build provenance, in a job that runs nothing from the tag.
    needs: [ref, image-ubi9]
    if: needs.image-ubi9.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.ref.outputs.ghcr }}
          subject-digest: ${{ needs.image-ubi9.outputs.digest }}
          push-to-registry: true
  image-sign:
    # Both images, by digest, signed by cosign without a key, on GHCR and on Docker Hub, with an
    # SBOM attestation each (SPDX, made from the pushed image), in a job that runs nothing from
    # the tag. Verify with cosign verify and cosign verify-attestation (docs/en/security.md).
    needs: [ref, image, image-ubi9]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    strategy:
      matrix:
        variant: [debian, ubi9]
    steps:
      - id: digest
        env:
          VARIANT: ${{ matrix.variant }}
          DEBIAN: ${{ needs.image.outputs.digest }}
          UBI9: ${{ needs.image-ubi9.outputs.digest }}
        run: |
          if [ "$VARIANT" = debian ]; then d=$DEBIAN; else d=$UBI9; fi
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - if: steps.digest.outputs.digest != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: v3.1.4
      - if: steps.digest.outputs.digest != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.digest.outputs.digest != '' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.digest.outputs.digest != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ needs.ref.outputs.ghcr }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - if: steps.digest.outputs.digest != ''
        name: sign and attest the image on each registry
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          GHCR: ${{ needs.ref.outputs.ghcr }}
          DOCKERHUB: ${{ vars.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/akko-mcp-trino', vars.DOCKERHUB_USERNAME) || '' }}
        run: |
          for name in "$GHCR" $DOCKERHUB; do
            cosign sign --yes "$name@$DIGEST"
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$name@$DIGEST"
          done
  chart:
    # The Helm chart of the tag, packaged once; the job that publishes and signs it runs nothing
    # from the tag. The chart's appVersion must be the tag's version.
    if: github.event_name == 'push'
    needs: ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HELM_VERSION: v3.20.2
      HELM_SHA256: 258e830a9e613c8a7a302d6059b4bb3b9758f2f3e1bb8ea0d707ce10a9a72fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
      - name: Install helm (exact version, checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components 1 linux-amd64/helm
          rm helm.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: package the chart, its appVersion checked against the tag
        env:
          TAG: ${{ needs.ref.outputs.tag }}
        run: |
          app=$(helm show chart charts/akko-mcp-trino | sed -n 's/^appVersion: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
          test "$app" = "${TAG#v}" || { echo "the chart's appVersion is $app, the tag is $TAG"; exit 1; }
          helm package charts/akko-mcp-trino -d chart/
          cd chart && for f in *.tgz; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: chart
          path: chart/
  chart-publish:
    # The chart on GHCR as an OCI artifact, signed by cosign without a key, and attached to the
    # release with its SHA-256 and its Sigstore bundle.
    needs: [ref, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      HELM_VERSION: v3.20.2
      HELM_SHA256: 258e830a9e613c8a7a302d6059b4bb3b9758f2f3e1bb8ea0d707ce10a9a72fea
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: chart
          path: chart/
      - name: Install helm (exact version, checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components 1 linux-amd64/helm
          rm helm.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: push the chart to GHCR and sign it there
        env:
          CHARTS: ${{ needs.ref.outputs.charts }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd chart
          sha256sum -c ./*.tgz.sha256
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push ./*.tgz "$CHARTS" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: //p' push.txt)
          name=$(helm show chart ./*.tgz | sed -n 's/^name: //p')
          test -n "$digest"
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "${CHARTS#oci://}/$name@$digest"
          rm push.txt
      - name: attach the chart to the release, with its SHA-256 and its Sigstore bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ref.outputs.tag }}
        run: |
          cd chart
          for f in ./*.tgz; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null; done
          gh release upload "$TAG" ./*.tgz ./*.sha256 ./*.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
  dockerhub-page:
    # The Docker Hub page (overview and short description) follows DOCKERHUB.md,
    # read from the tag pushed, or from the default branch when run by hand.
    if: vars.DOCKERHUB_USERNAME != ''
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/akko-mcp-trino
          short-description: "Read-only MCP server for Trino: queries run as the user, and Trino's own policies decide."
          readme-filepath: ./DOCKERHUB.md
