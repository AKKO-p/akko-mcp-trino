name: chart
on:
  push:
    branches: [main]
    paths: ["charts/**", "integration/helm/**", ".github/ct.yaml", ".github/workflows/chart.yml"]
  pull_request:
    paths: ["charts/**", "integration/helm/**", ".github/ct.yaml", ".github/workflows/chart.yml"]
permissions:
  contents: read
env:
  HELM_VERSION: v3.20.2
  HELM_SHA256: 258e830a9e613c8a7a302d6059b4bb3b9758f2f3e1bb8ea0d707ce10a9a72fea
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  CT_IMAGE: quay.io/helmpack/chart-testing:v3.15.0@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4
  # Kubernetes schemas and the OpenShift schemas (the Route), pinned by commit.
  K8S_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/86d045595d3f93b703bbf439cf9eb4bd6830d58f/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
  OPENSHIFT_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/6ab3493622cd387923a2d0da5234f53e80e1bd28/openshift/v4.15-strict/{{.ResourceKind}}_{{.Group}}_{{.ResourceAPIVersion}}.json
jobs:
  chart:
    name: helm lint, template, kubeconform, ct lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install helm and kubeconform (exact versions, checksums verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components 1 linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz -C "$RUNNER_TEMP/bin" kubeconform
          rm helm.tgz kubeconform.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: helm lint (defaults and every value set)
        run: |
          helm lint --strict charts/akko-mcp-trino -f charts/akko-mcp-trino/ci/default-values.yaml
          for f in charts/akko-mcp-trino/ci/*-values.yaml; do helm lint --strict charts/akko-mcp-trino -f "$f"; done
      - name: The render refusals
        run: bash integration/helm/refusals.sh
      - name: helm template and kubeconform (Kubernetes 1.32 to 1.36, OpenShift Route)
        run: |
          mkdir -p rendered
          for f in charts/akko-mcp-trino/ci/*-values.yaml integration/helm/values.yaml; do
            name="$(basename "$(dirname "$f")")-$(basename "$f" .yaml)"
            helm template mcp charts/akko-mcp-trino -f "$f" > "rendered/$name.yaml"
          done
          for k8s in 1.32.0 1.33.0 1.34.0 1.35.0 1.36.0; do
            echo "== Kubernetes $k8s"
            kubeconform -strict -summary -kubernetes-version "$k8s" \
              -schema-location "$K8S_SCHEMAS" -schema-location "$OPENSHIFT_SCHEMAS" rendered/*.yaml
          done
          grep -l 'kind: Route' rendered/*.yaml
      - name: ct lint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$CT_IMAGE" sh -c \
            'git config --global --add safe.directory /repo && ct lint --config .github/ct.yaml --all'
