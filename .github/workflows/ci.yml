name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" -e providers/openmetadata
      - name: lint and format (ruff)
        run: ruff check akko_mcp_trino tests examples && ruff format --check akko_mcp_trino tests examples
      - name: every public name is documented (ruff D)
        run: ruff check akko_mcp_trino --select D100,D101,D102,D103,D105,D107
      - name: types (mypy)
        run: mypy akko_mcp_trino
      - name: known vulnerabilities in dependencies (pip-audit)
        run: pip install --upgrade pip && pip-audit
      - name: product-neutral guard
        run: bash lint-vendor-neutral.sh
      - name: tests (100 % line and branch coverage required)
        run: python -m pytest -q
      - name: openmetadata provider (lint, types, docstrings, tests at 100 %)
        working-directory: providers/openmetadata
        run: |
          ruff check . && ruff format --check .
          ruff check akko_mcp_trino_openmetadata --select D100,D101,D102,D103,D105,D107
          mypy akko_mcp_trino_openmetadata
          python -m pytest -q
      - name: packages build and are valid
        run: |
          python -m build && twine check dist/*
          (cd providers/openmetadata && python -m build && twine check dist/*)
  image:
    name: container image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: akko-mcp-trino:ci
