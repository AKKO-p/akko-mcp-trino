name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: lint (ruff)
        run: ruff check akko_mcp_trino tests && ruff format --check akko_mcp_trino tests
      - name: product-neutral guard
        run: bash lint-vendor-neutral.sh
      - name: tests (100 % coverage required)
        run: python -m pytest -q
      - name: package builds and is valid
        run: python -m build && twine check dist/*
  image:
    name: container image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: akko-mcp-trino:ci
