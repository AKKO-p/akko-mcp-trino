name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -c image-requirements.txt -e ".[dev]"
      - name: lint and format (ruff)
        run: ruff check akko_mcp_trino tests examples && ruff format --check akko_mcp_trino tests examples
      - name: every public name is documented (ruff D)
        run: ruff check akko_mcp_trino --select D100,D101,D102,D103,D105,D107
      - name: types (mypy)
        run: mypy akko_mcp_trino
      - name: known vulnerabilities in dependencies (pip-audit)
        run: pip install --upgrade pip && pip-audit
      - name: product-neutral guard
        run: bash lint-vendor-neutral.sh
      - name: tests (100 % line and branch coverage)
        run: python -m pytest -q
      - name: sdist and wheel build and are valid
        run: python -m build && twine check dist/*
  ranges:
    name: dependency ranges (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv venv && uv pip install --resolution ${{ matrix.resolution }} -e . "pytest==9.1.1" "pytest-cov==7.1.0"
      - name: tests at the ${{ matrix.resolution }} versions of every dependency
        run: .venv/bin/python -m pytest -q
  integration:
    # The identity modes, live: a disposable Keycloak (token exchange) and Trino (JWT and
    # client certificates), three servers built from this commit, every check of
    # integration/check.py, then everything removed.
    name: integration (Keycloak and Trino)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build, start, check, remove
        run: bash integration/run.sh
  image:
    name: container image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: akko-mcp-trino:ci
