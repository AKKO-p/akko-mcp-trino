name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Read-only by default; no job of the checks writes.
permissions:
  contents: read
jobs:
  versions:
    # The Python versions and image platforms, from scripts/lock.sh, the one place they are set.
    name: versions
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.lock.outputs.python }}
      pythons: ${{ steps.lock.outputs.pythons }}
      platforms: ${{ steps.lock.outputs.platforms }}
      glibc: ${{ steps.lock.outputs.glibc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: lock
        run: bash scripts/lock.sh outputs >> "$GITHUB_OUTPUT"
  locks:
    # The locks match their sources (compiled again, hashes included, nothing may change), the
    # image lock resolves to wheels for every platform of the image, and the Dependabot file is
    # valid. The kerberos lock of the Atlas provider builds gssapi's metadata against the
    # system's MIT Kerberos.
    name: locks
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libkrb5-dev
      - run: pip install --require-hashes -r requirements/build.txt -r requirements/dev.txt
      - name: the locks are fresh
        run: bash scripts/lock.sh check
      - name: the image lock resolves for every platform
        run: bash scripts/lock.sh verify
      - name: the Dependabot file is valid
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
  test:
    # The core alone, then the core with each context provider of providers/: the core's
    # tests, its contract included, run in every case, and each provider runs its own.
    name: test (python ${{ matrix.python }}, ${{ matrix.packages }})
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.pythons) }}
        packages: [core, core+atlas]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The tools and every dependency from the locks, with their hashes; the package itself from
      # this commit, without dependencies, built by the locked backend.
      - run: |
          pip install --require-hashes -r requirements/build.txt -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e .
      - name: install the Atlas provider
        if: matrix.packages == 'core+atlas'
        # As the core: its dependencies come from the locks, and pip check proves they hold
        # what it declares, the core of this commit included.
        run: |
          pip install --no-deps --no-build-isolation -e providers/atlas
          pip check
      - name: lint and format (ruff)
        run: |
          ruff check akko_mcp_trino tests examples integration
          ruff format --check akko_mcp_trino tests examples integration
      - name: every public name is documented (ruff D)
        run: ruff check akko_mcp_trino --select D100,D101,D102,D103,D105,D107
      - name: types (mypy)
        run: mypy akko_mcp_trino
      - name: known vulnerabilities in the locked dependencies (pip-audit)
        run: |
          pip-audit --disable-pip --require-hashes -r requirements/image.txt -r requirements/build.txt \
            -r requirements/release.txt -r requirements/dev.txt -r requirements/kerberos.txt
      - name: product-neutral guard
        run: bash lint-vendor-neutral.sh
      - name: tests (100 % line and branch coverage)
        run: python -m pytest -q
      - name: Atlas provider, lint, documented names, types, tests (100 % coverage)
        if: matrix.packages == 'core+atlas'
        working-directory: providers/atlas
        run: |
          ruff check . && ruff format --check .
          ruff check akko_mcp_trino_atlas --select D100,D101,D102,D103,D105,D107
          mypy akko_mcp_trino_atlas
          python -m pytest -q
      - name: sdist and wheel build and are valid
        run: python -m build --no-isolation && twine check dist/*
      - name: the Atlas provider's sdist and wheel build and are valid
        if: matrix.packages == 'core+atlas'
        run: python -m build --no-isolation --outdir dist-atlas providers/atlas && twine check dist-atlas/*
      - name: the tests pass from the sdist
        if: matrix.packages == 'core'
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/akko_mcp_trino-* && python -m pytest -q -p no:cacheprovider
      - name: licenses of what the packages install (no GPL, AGPL or Collate Community License)
        # In an environment of their own, holding what the image installs (its lock and the
        # packages), so that the test and release tools do not count. The
        # first list matches within a license name, the second matches SPDX identifiers
        # exactly, so that the LGPL is not taken for the GPL. A choice between licenses
        # ("MIT OR GPL-2.0-only") passes: the permissive one applies.
        run: |
          python -m venv /tmp/licenses
          /tmp/licenses/bin/pip install --only-binary=:all: --require-hashes -r requirements/image.txt
          /tmp/licenses/bin/pip install --no-deps ./dist/*.whl
          if [ "${{ matrix.packages }}" = "core+atlas" ]; then
            /tmp/licenses/bin/pip install --no-deps ./dist-atlas/*.whl
            # The image lock holds the provider's dependencies, as it does the core's.
            /tmp/licenses/bin/pip check
            # The kerberos extra of the provider (pyspnego, gssapi, krb5), as the image installs
            # it: wheels from its lock with their hashes, gssapi and krb5 built from their sdists
            # without isolation by the locked build tools, against the system's MIT Kerberos,
            # then installed from those wheels only.
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libkrb5-dev
            pip wheel --no-deps --no-build-isolation --require-hashes \
              -r requirements/kerberos.txt -w /tmp/kerberos
            /tmp/licenses/bin/pip install --no-index --find-links /tmp/kerberos \
              "akko-mcp-trino-atlas[kerberos]"
            /tmp/licenses/bin/pip check
            pip-licenses --python /tmp/licenses/bin/python --packages pyspnego gssapi krb5
          fi
          pip-licenses --python /tmp/licenses/bin/python --partial-match --fail-on "GNU General Public License;GNU Affero General Public License;AGPL;Collate Community License"
          pip-licenses --python /tmp/licenses/bin/python --fail-on "GPL;GPLv2;GPLv2+;GPLv3;GPLv3+;GPL-2.0;GPL-2.0+;GPL-3.0;GPL-3.0+;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later"
  ranges:
    name: dependency ranges (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      matrix:
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
      # uv and the test tools at the versions of requirements/dev.txt; the package's dependencies
      # at the versions its ranges allow.
      - run: pip install --require-hashes -r requirements/build.txt -r requirements/dev.txt
      - run: uv venv && uv pip install --resolution ${{ matrix.resolution }} -e . $(bash scripts/lock.sh pins pytest pytest-cov)
      - name: tests at the ${{ matrix.resolution }} versions of every dependency
        run: .venv/bin/python -m pytest -q
  windows:
    # The parse workers on Windows, where hosts such as Claude Desktop and Cursor start the
    # server over stdio: the pool's tests and the stdio end-to-end test only. The locks are
    # compiled on Linux, so they leave out what a package needs on Windows alone (colorama for
    # pytest's colours, pywin32 for the SDK's client): --no-deps installs the lock as it is,
    # and neither is needed here.
    name: parse workers (windows)
    runs-on: windows-latest
    needs: versions
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
      - run: |
          pip install --no-deps --require-hashes -r requirements/build.txt -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e .
      - name: the parse pool and the stdio end-to-end test
        run: python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_parse_pool.py tests/test_parse_process.py
  integration:
    # The identity modes, live: a disposable Keycloak (token exchange) and Trino (JWT and
    # client certificates), three servers built from this commit, every check of
    # integration/check.py, then everything removed.
    name: integration (Keycloak and Trino)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build, start, check, remove
        run: bash integration/run.sh
  image:
    name: container image builds
    runs-on: ubuntu-latest
    needs: [versions, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: akko-mcp-trino:ci
      - name: the image's glibc is the one the lock's wheels are verified for
        run: |
          glibc=$(docker run --rm akko-mcp-trino:ci ldd --version | head -1 | awk '{print $NF}')
          echo "image glibc $glibc, scripts/lock.sh ${{ needs.versions.outputs.glibc }}"
          test "$glibc" = "${{ needs.versions.outputs.glibc }}"
  changes:
    # Whether this push or pull request touches what the image is built from, or this workflow;
    # the arm64 build runs only then.
    name: changes
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push with no previous commit (a new branch) counts as touching everything.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo image=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if printf '%s\n' "$files" | grep -qE '^(Dockerfile|requirements/.*|pyproject\.toml|providers/atlas/pyproject\.toml|\.github/workflows/ci\.yml)$'; then
            echo image=true >> "$GITHUB_OUTPUT"
          else
            echo image=false >> "$GITHUB_OUTPUT"
          fi
  image-arm64:
    # The image for linux/arm64, under QEMU, when what it is built from changes: gssapi and krb5
    # are compiled from their sdists under emulation (about 80 minutes), and an apt pin may
    # exist for one architecture and not the other. Then the version and the Kerberos check
    # run inside it.
    name: container image builds (linux/arm64)
    runs-on: ubuntu-latest
    needs: changes
    # A dispatch skips the changes job; !cancelled() lets this job run then, and a cancelled run
    # still cancels it.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true')
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: akko-mcp-trino:ci-arm64
      - name: the image runs on arm64, prints its version and checks Kerberos
        # --check without --strict: no Atlas answers here, the configuration and the Kerberos
        # libraries are what is checked. The keytab is an empty file the server can read.
        run: |
          test "$(docker run --rm --platform linux/arm64 akko-mcp-trino:ci-arm64 uname -m)" = aarch64
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "$(docker run --rm --platform linux/arm64 akko-mcp-trino:ci-arm64 akko-mcp-trino --version)" = \
            "akko-mcp-trino $version"
          keytab=$(mktemp) && chmod 644 "$keytab" && settings=$(mktemp)
          printf '%s\n' TRINO_IDENTITY_MODE=service MCP_AUTH_ENABLED=false MCP_AUTH_REQUIRED=false \
            MCP_CONTEXT_PROVIDERS=atlas 'ATLAS_CLUSTERS={"lake":"primary"}' \
            ATLAS_URL=http://atlas.invalid:21000 ATLAS_AUTH=kerberos \
            ATLAS_PRINCIPAL=mcp-reader@EXAMPLE.ORG ATLAS_KEYTAB=/tmp/mcp.keytab > "$settings"
          docker run --rm --platform linux/arm64 -v "$keytab:/tmp/mcp.keytab:ro" --env-file="$settings" akko-mcp-trino:ci-arm64 akko-mcp-trino --check
