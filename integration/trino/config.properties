coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/certs/trino.pem
# Client certificates are checked against the integration CA.
http-server.https.truststore.path=/certs/ca.crt

# Two ways in, both verified by Trino itself:
#  - a client certificate: the server's own account in impersonation mode (CN=mcp-service);
#  - a JWT issued for Trino: the token the server obtained by token exchange in jwt mode.
http-server.authentication.type=CERTIFICATE,JWT
http-server.authentication.certificate.user-mapping.pattern=CN=([^,]+).*
http-server.authentication.jwt.key-file=http://keycloak:8080/realms/integration/protocol/openid-connect/certs
http-server.authentication.jwt.principal-field=preferred_username
http-server.authentication.jwt.required-issuer=https://keycloak:8443/realms/integration
http-server.authentication.jwt.required-audience=trino

internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
query.max-memory=256MB
query.max-memory-per-node=256MB
