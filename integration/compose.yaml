# The live proof of the identity modes, against a disposable Keycloak and Trino.
# Nothing is published on the host: every check runs inside the compose network.
#
#   integration/run.sh        starts everything, runs integration/check.py, removes everything
#
# The secrets (the server's client secret, the users' password, Trino's shared
# secret) are generated by run.sh for each run; none is written in this repository.

name: ${COMPOSE_PROJECT_NAME:-akko-mcp-trino-it}

x-defaults: &defaults
  restart: "no"
  security_opt: ["no-new-privileges:true"]

x-mcp: &mcp
  <<: *defaults
  image: ${MCP_IMAGE:-akko-mcp-trino:integration}
  pull_policy: never   # built from this repository by run.sh, never pulled
  volumes:
    - certs:/certs:ro
  depends_on:
    trino: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready')"]
    interval: 3s
    timeout: 5s
    retries: 40
  mem_limit: 256m

services:
  certs:
    <<: *defaults
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "/certs.sh"]
    volumes:
      - ./certs.sh:/certs.sh:ro
      - certs:/certs
    mem_limit: 32m

  keycloak:
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.7.5
    command:
      - start-dev
      - --import-realm
      - --https-certificate-file=/certs/keycloak.crt
      - --https-certificate-key-file=/certs/keycloak.key
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?generated by run.sh}
      # Every token carries this issuer, whoever asked for it inside the network.
      KC_HOSTNAME: https://keycloak:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx448m"
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:?generated by run.sh}
      INTEGRATION_PASSWORD: ${INTEGRATION_PASSWORD:?generated by run.sh}
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/integration.json:ro
      - certs:/certs:ro
    depends_on:
      certs: {condition: service_completed_successfully}
    healthcheck:
      # Healthy once the realm serves its signing keys: Trino reads them as it starts,
      # and gives up if they do not come in time. The image has no curl.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/integration/protocol/openid-connect/certs HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"keys\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 768m

  trino:
    <<: *defaults
    image: trinodb/trino:482
    environment:
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET:?generated by run.sh}
    volumes:
      - ./trino:/etc/trino:ro
      - certs:/certs:ro
    depends_on:
      certs: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 1280m

  # The default identity mode (jwt), not named: each query runs as the caller, with
  # a token for Trino obtained by token exchange.
  mcp-jwt:
    <<: *mcp
    build: {context: .., dockerfile: Dockerfile}
    environment: &jwt-environment
      TRINO_HOST: trino
      TRINO_PORT: "8443"
      TRINO_HTTP_SCHEME: https
      TRINO_VERIFY: /certs/ca.crt
      TRINO_CATALOG: tpch
      MCP_JWKS_URL: http://keycloak:8080/realms/integration/protocol/openid-connect/certs
      MCP_OIDC_ISSUER: https://keycloak:8443/realms/integration
      MCP_OIDC_AUDIENCE: akko-mcp
      MCP_RESOURCE_URL: http://mcp-jwt:3000/mcp
      TRINO_TOKEN_EXCHANGE_URL: https://keycloak:8443/realms/integration/protocol/openid-connect/token
      TRINO_TOKEN_EXCHANGE_CLIENT_ID: akko-mcp
      TRINO_TOKEN_EXCHANGE_CLIENT_SECRET: ${MCP_CLIENT_SECRET}
      TRINO_TOKEN_EXCHANGE_AUDIENCE: trino
      TRINO_TOKEN_EXCHANGE_VERIFY: /certs/ca.crt

  # The same server with pages of three rows and three tables, so that the paged tools have more than one page.
  mcp-paged:
    <<: *mcp
    environment:
      <<: *jwt-environment
      TRINO_MAX_ROWS: "3"
      MCP_DESCRIBE_SCHEMA_TABLES: "3"
      MCP_RESOURCE_URL: http://mcp-paged:3000/mcp

  # The fallback for an identity provider without token exchange: the server's own
  # account (a client certificate) and Trino's impersonation, limited to that account.
  mcp-impersonation:
    <<: *mcp
    environment:
      TRINO_IDENTITY_MODE: impersonation
      TRINO_HOST: trino
      TRINO_PORT: "8443"
      TRINO_HTTP_SCHEME: https
      TRINO_VERIFY: /certs/ca.crt
      TRINO_CATALOG: tpch
      TRINO_USER: mcp-service
      TRINO_CLIENT_CERT: /certs/mcp-service.crt
      TRINO_CLIENT_KEY: /certs/mcp-service.key
      MCP_JWKS_URL: http://keycloak:8080/realms/integration/protocol/openid-connect/certs
      MCP_OIDC_ISSUER: https://keycloak:8443/realms/integration
      MCP_OIDC_AUDIENCE: akko-mcp

  # Service mode with an open door, chosen explicitly: it must say so to every host.
  mcp-service:
    <<: *mcp
    environment:
      TRINO_IDENTITY_MODE: service
      MCP_AUTH_ENABLED: "false"
      MCP_AUTH_REQUIRED: "false"
      TRINO_HOST: trino
      TRINO_PORT: "8443"
      TRINO_HTTP_SCHEME: https
      TRINO_VERIFY: /certs/ca.crt
      TRINO_CATALOG: tpch
      TRINO_USER: mcp-service
      TRINO_CLIENT_CERT: /certs/mcp-service.crt
      TRINO_CLIENT_KEY: /certs/mcp-service.key

  check:
    <<: *defaults
    image: ${MCP_IMAGE:-akko-mcp-trino:integration}
    pull_policy: never
    profiles: ["check"]
    entrypoint: ["python", "/integration/check.py"]
    environment:
      INTEGRATION_PASSWORD: ${INTEGRATION_PASSWORD}
    volumes:
      - ./check.py:/integration/check.py:ro
      - certs:/certs:ro
    mem_limit: 128m

volumes:
  certs:
