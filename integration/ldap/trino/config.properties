coordinator=true
node-scheduler.include-coordinator=true
# https only: the HTTP port is closed, and the node reaches itself over https at localhost,
# the name its certificate (signed by the internal certificate authority of the run) carries.
http-server.http.enabled=false
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/certs/trino.pem
discovery.uri=https://localhost:8443
internal-communication.https.required=true
internal-communication.https.keystore.path=/certs/trino.pem
node.internal-address=localhost

# One way in: a user name and its password, checked by a bind to the directory
# (password-authenticator.properties). No OAuth 2.0, no JWT: Trino cannot exchange
# or verify a token, so the MCP server runs in impersonation mode.
http-server.authentication.type=PASSWORD

internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
query.max-memory=256MB
query.max-memory-per-node=256MB
