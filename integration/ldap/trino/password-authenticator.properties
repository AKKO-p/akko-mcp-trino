# Each user's password is checked by a bind as that user to the directory, over LDAPS,
# its certificate checked against the internal certificate authority.
password-authenticator.name=ldap
ldap.url=ldaps://ldap:6360
ldap.ssl.truststore.path=/certs/ca.crt
ldap.user-bind-pattern=uid=${USER},ou=people,dc=example,dc=org
