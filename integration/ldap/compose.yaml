# The live proof of the most constrained deployment: Trino authenticates by password against
# a directory (LDAP), over https with a certificate of an internal authority; the MCP server,
# from the UBI 9 image, runs in impersonation mode with its own directory account, read-only
# and as an arbitrary user; callers bring a token from an identity provider federated on the
# same directory, verified by JWKS over https against the same internal authority.
#
#   integration/ldap/run.sh   builds the UBI 9 image, starts everything, runs check.py,
#                             removes everything
#
# Nothing is published on the host: every check runs inside the compose network. The
# passwords and secrets are generated by run.sh for each run; none is written here.

name: ${COMPOSE_PROJECT_NAME:-akko-mcp-trino-ldap}

x-defaults: &defaults
  restart: "no"
  security_opt: ["no-new-privileges:true"]

services:
  certs:
    <<: *defaults
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "/certs.sh"]
    volumes:
      - ../certs.sh:/certs.sh:ro
      - certs:/certs
    mem_limit: 32m

  # The directory: three accounts (seed.sh), LDAPS on 6360 with the internal authority's
  # certificate. Its plain LDAP port and its API stay inside the network.
  ldap:
    <<: *defaults
    image: lldap/lldap:v0.6.3-alpine-rootless
    environment:
      LLDAP_LDAP_BASE_DN: dc=example,dc=org
      LLDAP_LDAP_USER_PASS: ${LDAP_ADMIN_PASSWORD:?generated by run.sh}
      LLDAP_JWT_SECRET: ${LDAP_JWT_SECRET:?generated by run.sh}
      LLDAP_KEY_SEED: ${LDAP_KEY_SEED:?generated by run.sh}
      LLDAP_DATABASE_URL: sqlite:///data/users.db?mode=rwc
      LLDAP_LDAPS_OPTIONS__ENABLED: "true"
      LLDAP_LDAPS_OPTIONS__PORT: "6360"
      LLDAP_LDAPS_OPTIONS__CERT_FILE: /certs/ldap.crt
      LLDAP_LDAPS_OPTIONS__KEY_FILE: /certs/ldap.key
    tmpfs:
      - /data:uid=1000,gid=1000
    volumes:
      - certs:/certs:ro
    depends_on:
      certs: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:17170/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 128m

  ldap-seed:
    <<: *defaults
    image: lldap/lldap:v0.6.3-alpine-rootless
    entrypoint: ["/bin/sh", "/seed.sh"]
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      MCP_SERVER_PASSWORD: ${MCP_SERVER_PASSWORD:?generated by run.sh}
      ALICE_PASSWORD: ${ALICE_PASSWORD:?generated by run.sh}
      BOB_PASSWORD: ${BOB_PASSWORD:?generated by run.sh}
    volumes:
      - ./seed.sh:/seed.sh:ro
    depends_on:
      ldap: {condition: service_healthy}
    mem_limit: 64m

  # The identity provider of the callers, federated on the directory (read-only): a user's
  # password is checked by a bind, and the token names the user by their uid.
  keycloak:
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.7.5
    command:
      - start-dev
      - --import-realm
      - --https-certificate-file=/certs/keycloak.crt
      - --https-certificate-key-file=/certs/keycloak.key
      - --truststore-paths=/certs/ca.crt
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?generated by run.sh}
      KC_HOSTNAME: https://keycloak:8443
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx448m"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/ldap.json:ro
      - certs:/certs:ro
    depends_on:
      ldap-seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/ldap/protocol/openid-connect/certs HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"keys\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 768m

  trino:
    <<: *defaults
    image: trinodb/trino:482
    environment:
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET:?generated by run.sh}
    volumes:
      # integration/trino with this scenario's files over it, assembled by run.sh.
      - ${TRINO_ETC:?assembled by run.sh}:/etc/trino:ro
      - certs:/certs:ro
    depends_on:
      ldap-seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 2304m

  # The server from the UBI 9 image, as OpenShift's restricted-v2 SCC runs it: an arbitrary
  # UID in group 0, no capability, a read-only root file system and /tmp in memory.
  mcp:
    <<: *defaults
    image: ${MCP_IMAGE:-akko-mcp-trino:ubi9}
    pull_policy: never   # built from this repository by run.sh, never pulled
    user: "1234567:0"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    environment:
      TRINO_IDENTITY_MODE: impersonation
      TRINO_HOST: trino
      TRINO_PORT: "8443"
      TRINO_HTTP_SCHEME: https
      TRINO_VERIFY: /certs/ca.crt
      TRINO_CATALOG: tpch
      TRINO_USER: mcp-server
      TRINO_PASSWORD: ${MCP_SERVER_PASSWORD}
      # The JWKS over https, checked against the internal authority: the bundle replaces the
      # system's, as the chart's ca.setSslCertFile does.
      SSL_CERT_FILE: /certs/ca.crt
      MCP_JWKS_URL: https://keycloak:8443/realms/ldap/protocol/openid-connect/certs
      MCP_OIDC_ISSUER: https://keycloak:8443/realms/ldap
      MCP_OIDC_AUDIENCE: mcp-trino
      MCP_JWT_USER_CLAIM: preferred_username  # the uid in the directory; Keycloak's sub is a UUID
    volumes:
      - certs:/certs:ro
    depends_on:
      trino: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready')"]
      interval: 3s
      timeout: 5s
      retries: 40
    mem_limit: 256m

  check:
    <<: *defaults
    image: ${MCP_IMAGE:-akko-mcp-trino:ubi9}
    pull_policy: never
    profiles: ["check"]
    entrypoint: ["python", "/integration/check.py"]
    environment:
      MCP_SERVER_PASSWORD: ${MCP_SERVER_PASSWORD}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
      BOB_PASSWORD: ${BOB_PASSWORD}
    volumes:
      - ./check.py:/integration/check.py:ro
      - certs:/certs:ro
    mem_limit: 128m

volumes:
  certs:
