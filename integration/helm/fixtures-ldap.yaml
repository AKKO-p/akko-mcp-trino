# Disposable fixtures of the chart's ldap proof (openshift-ldap.sh), the cluster version of
# integration/ldap: the directory (three accounts, LDAPS), Keycloak federated on it, and Trino
# over https with password authentication against it. Certificates and passwords are
# generated by openshift-ldap.sh and removed at the end. No fixed UID: everything runs under
# OpenShift's restricted-v2 SCC as it is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
spec:
  replicas: 1
  selector:
    matchLabels: {app: ldap}
  template:
    metadata:
      labels: {app: ldap}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ldap
          image: lldap/lldap:v0.6.3-alpine-rootless
          env:
            - {name: LLDAP_LDAP_BASE_DN, value: "dc=example,dc=org"}
            - name: LLDAP_LDAP_USER_PASS
              valueFrom: {secretKeyRef: {name: it-ldap-secrets, key: LDAP_ADMIN_PASSWORD}}
            - name: LLDAP_JWT_SECRET
              valueFrom: {secretKeyRef: {name: it-ldap-secrets, key: LDAP_JWT_SECRET}}
            - name: LLDAP_KEY_SEED
              valueFrom: {secretKeyRef: {name: it-ldap-secrets, key: LDAP_KEY_SEED}}
            - {name: LLDAP_DATABASE_URL, value: "sqlite:///data/users.db?mode=rwc"}
            - {name: LLDAP_LDAPS_OPTIONS__ENABLED, value: "true"}
            - {name: LLDAP_LDAPS_OPTIONS__PORT, value: "6360"}
            - {name: LLDAP_LDAPS_OPTIONS__CERT_FILE, value: /certs/ldap.crt}
            - {name: LLDAP_LDAPS_OPTIONS__KEY_FILE, value: /certs/ldap.key}
          ports:
            - {name: http, containerPort: 17170}
            - {name: ldaps, containerPort: 6360}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            # Writable whatever the UID (OpenShift assigns an arbitrary one).
            - {name: data, mountPath: /data}
            - {name: certs, mountPath: /certs, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        - name: certs
          secret: {secretName: it-certs, defaultMode: 0444}
---
apiVersion: v1
kind: Service
metadata:
  name: ldap
spec:
  selector: {app: ldap}
  ports:
    - {name: http, port: 17170, targetPort: http}
    - {name: ldaps, port: 6360, targetPort: ldaps}
---
# The three accounts, created once the directory answers (integration/ldap/seed.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: ldap-seed
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: seed
          image: lldap/lldap:v0.6.3-alpine-rootless
          command: [/bin/sh, /seed/seed.sh]
          envFrom:
            - secretRef: {name: it-ldap-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: seed, mountPath: /seed, readOnly: true}
      volumes:
        - name: seed
          configMap: {name: ldap-seed}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.5
          args:
            - start-dev
            - --import-realm
            - --https-certificate-file=/certs/keycloak.crt
            - --https-certificate-key-file=/certs/keycloak.key
            - --truststore-paths=/certs/ca.crt
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: it-ldap-secrets, key: KEYCLOAK_ADMIN_PASSWORD}}
            - {name: KC_HOSTNAME, value: "https://keycloak:8443"}
            - {name: JAVA_OPTS_KC_HEAP, value: "-Xms64m -Xmx448m"}
            - name: LDAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: it-ldap-secrets, key: LDAP_ADMIN_PASSWORD}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /realms/ldap/protocol/openid-connect/certs, port: http}
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: certs, mountPath: /certs, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm-ldap}
        - name: certs
          secret: {secretName: it-certs, defaultMode: 0444}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - {name: https, port: 8443, targetPort: https}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
spec:
  replicas: 1
  selector:
    matchLabels: {app: trino}
  template:
    metadata:
      labels: {app: trino}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: trino
          image: trinodb/trino:482
          env:
            - name: TRINO_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: it-ldap-secrets, key: TRINO_SHARED_SECRET}}
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            exec: {command: [/usr/lib/trino/bin/health-check]}
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 1280Mi}
            limits: {cpu: "1", memory: 1280Mi}
          volumeMounts:
            - {name: etc, mountPath: /etc/trino, readOnly: true}
            - {name: certs, mountPath: /certs, readOnly: true}
            - {name: data, mountPath: /data/trino}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 512Mi}
        - name: etc
          configMap:
            name: trino-etc-ldap
            items:
              - {key: config.properties, path: config.properties}
              - {key: password-authenticator.properties, path: password-authenticator.properties}
              - {key: jvm.config, path: jvm.config}
              - {key: node.properties, path: node.properties}
              - {key: log.properties, path: log.properties}
              - {key: access-control.properties, path: access-control.properties}
              - {key: rules.json, path: rules.json}
              - {key: tpch.properties, path: catalog/tpch.properties}
        - name: certs
          secret: {secretName: it-certs, defaultMode: 0444}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
spec:
  selector: {app: trino}
  ports:
    - {name: https, port: 8443, targetPort: https}
