# The chart as the ldap proof (openshift-ldap.sh) installs it: the UBI 9 image from the
# project's own registry (image.repository and image.digest are set by the script), Trino
# over https with password authentication against the directory, the server in impersonation
# mode with its own directory account (password from a Secret), the callers' tokens from
# Keycloak federated on the same directory, the internal authority mounted for Trino and for
# the JWKS fetch, the NetworkPolicy on: ingress from the test client only, egress to DNS,
# Trino and Keycloak only.
trino:
  host: trino
  port: 8443
  catalog: tpch
  identityMode: impersonation
  user: mcp-server
  credential: password
auth:
  jwksUrl: https://keycloak:8443/realms/ldap/protocol/openid-connect/certs
  issuer: https://keycloak:8443/realms/ldap
  audience: mcp-trino
  userClaim: preferred_username   # the uid in the directory; Keycloak's sub is a UUID
existingSecret:
  name: mcp-credentials
ca:
  secret: it-certs
  key: ca.crt
networkPolicy:
  enabled: true
  ingress:
    from:
      - podSelector:
          matchLabels:
            mcp-chart-test/client: "true"
  egress:
    trino:
      - podSelector:
          matchLabels:
            app: trino
    identityProvider:
      to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - port: 8443
          protocol: TCP
