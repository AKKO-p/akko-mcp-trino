[pytest]
# STRICT gate: 100 % coverage of the core, by its own tests. A core that needed
# a product to be tested would not be extracted.
addopts = --cov=akko_mcp_trino --cov-branch --cov-report=term-missing --cov-fail-under=100 -p no:cacheprovider
testpaths = tests
# Starlette's test client (a third-party module) reads a deprecated alias of anyio
# when it is imported; nothing in this repository can avoid it.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
