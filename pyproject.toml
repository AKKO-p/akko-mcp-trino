[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akko-mcp-trino"
version = "0.7.2"
description = "Read-only MCP server for Trino: nine tools, writes refused on the SQL tree, queries as the verified user (token exchange or impersonation) or one named identity, bounded rows and time, one audit line per call."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "AKKO", email = "contact@akko-ai.com" }]
maintainers = [{ name = "AKKO", email = "contact@akko-ai.com" }]
keywords = [
  "mcp", "model-context-protocol", "trino", "lakehouse", "data-governance",
  "ai-agents", "oidc", "jwt", "token-exchange", "opa", "ranger", "sql", "llm", "agent-gateway",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Ranges, so that the server installs next to other tools and in conda-forge;
# the lower bounds are tested in CI. The container image installs the exact
# versions of image-requirements.txt.
dependencies = [
  "mcp[cli]>=2.3.0,<3",
  "trino>=0.340.0,<1",
  "httpx>=0.28.1,<1",
  "starlette>=1.10.0,<2",
  "uvicorn>=0.54.0,<1",
  "sqlglot>=30.29.0,<31",
  "prometheus-client>=0.26.0,<1",
  "PyJWT[crypto]>=2.15.1,<3",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
# What an adapter installs to run the published contract: ranges, so its own pins do not clash.
contract = ["pytest>=9.2.0,<10"]
test = ["pytest==9.2.0", "pytest-cov==7.1.0"]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3", "mypy==2.4.1", "pip-audit==2.10.1", "build==1.6.1", "twine==7.0.0"]
# The Apache Atlas context provider (providers/atlas), with Kerberos; released with the core.
atlas = ["akko-mcp-trino-atlas[kerberos]==0.7.2"]

[project.scripts]
akko-mcp-trino = "akko_mcp_trino.__main__:main"

[project.entry-points."akko_mcp_trino.extensions"]
token-policy = "akko_mcp_trino.modules.token_policy:create"
fingerprint-audit = "akko_mcp_trino.modules.fingerprint_audit:create"
trino-tags = "akko_mcp_trino.modules.trino_tags:create"

[project.entry-points."akko_mcp_trino.context"]
file = "akko_mcp_trino.context.file:from_env"

[project.urls]
Homepage = "https://github.com/AKKO-p/akko-mcp-trino"
Documentation = "https://github.com/AKKO-p/akko-mcp-trino#readme"
Repository = "https://github.com/AKKO-p/akko-mcp-trino"
Issues = "https://github.com/AKKO-p/akko-mcp-trino/issues"
Changelog = "https://github.com/AKKO-p/akko-mcp-trino/blob/main/CHANGELOG.md"
AKKO = "https://akko-ai.com"

# Packages are found, never listed, so that no sub-package can miss the wheel.
[tool.setuptools.packages.find]
include = ["akko_mcp_trino", "akko_mcp_trino.*"]

[tool.setuptools.package-data]
akko_mcp_trino = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# The package documents every public name; tests and examples need not.
"akko_mcp_trino/**" = []

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
